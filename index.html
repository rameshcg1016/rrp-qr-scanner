<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

</style>

</head>


<body>

<div class="container">

<h2>RRP PART QR SCANNER</h2>

<div id="reader"></div>

<div class="message" id="message">
Starting camera...
</div>

</div>


<script>

const scanner = new Html5Qrcode("reader");


function onScanSuccess(decodedText) {

    var internalPart = decodedText.trim();

    document.getElementById("message").innerHTML =
        "Scanned: " + internalPart;


    scanner.stop().then(function() {

        var appURL =
            "https://script.google.com/macros/s/AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA/exec";


        window.location.href =
            appURL +
            "?page=supply&part=" +
            encodeURIComponent(internalPart);

    }).catch(function(error) {

        document.getElementById("message").innerHTML =
            "Scanned: " + internalPart;

    });

}


/*
====================================================
GET AVAILABLE CAMERAS
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {

    if (!cameras || cameras.length === 0) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    Use the first available camera.
    This avoids forcing environment/user-facing.
    */

    var cameraId = cameras[0].id;


    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )

    .then(function() {

        document.getElementById("message").innerHTML =
            "Point the camera at the Part QR";

    })

    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error: " + error;

    });

})


.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera: " + error;

});

</script>

</body>

</html>
