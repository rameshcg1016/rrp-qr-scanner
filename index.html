<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f2f2f2;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

h2{
    text-align:center;
}

#reader{
    width:100%;
    margin-top:20px;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>RRP PART QR SCANNER</h2>

<div id="reader"></div>

<div class="message" id="message">
Point the camera at the Part QR
</div>

</div>

<script>

const scanner = new Html5Qrcode("reader");

function onScanSuccess(decodedText){

    // QR must contain only Internal Part Number
    var internalPart = decodedText.trim();

    document.getElementById("message").innerHTML =
        "Scanned: " + internalPart;

    scanner.stop().then(function(){

        // Your Apps Script Web App
        var appURL =
        "https://script.google.com/macros/s/AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA/exec";

        // Return scanned Internal Part Number
        window.location.href =
            appURL +
            "?page=supply&part=" +
            encodeURIComponent(internalPart);

    });

}

scanner.start(

    { facingMode: "environment" },

    {
        fps:10,
        qrbox:{
            width:250,
            height:250
        }
    },

    onScanSuccess

).catch(function(error){

    document.getElementById("message").innerHTML =
        "❌ Camera error: " + error;

});

</script>

</body>

</html>
