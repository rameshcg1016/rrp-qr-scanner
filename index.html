<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner - TEST</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.version {
    background: black;
    color: white;
    padding: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    margin-bottom: 15px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
    line-height: 1.6;
}

.debug {
    margin-top: 15px;
    padding: 12px;
    background: #eeeeee;
    border-radius: 6px;
    word-break: break-all;
}

</style>

</head>


<body>

<div class="container">

<div class="version">
RRP SCANNER TEST VERSION 001
</div>

<h2>RRP QR SCANNER</h2>

<div id="reader"></div>

<div id="message">
Starting camera...
</div>

<div class="debug" id="debug">
Waiting for scanner...
</div>

</div>


<script>

/*
====================================================
READ CURRENT URL
====================================================
*/

const currentURL =
    new URL(window.location.href);

const params =
    currentURL.searchParams;


/*
====================================================
READ PARAMETERS
====================================================
*/

const typeParameter =
    params.get("type") || "";

const existingPart =
    params.get("part") || "";

const versionParameter =
    params.get("v") || "";


/*
====================================================
DETERMINE MODE
====================================================
*/

let scanType = "part";

if (existingPart.trim() !== "") {

    scanType = "tray";

}


/*
====================================================
DISPLAY DEBUG INFORMATION
====================================================
*/

document.getElementById("debug").innerHTML =

    "<b>LIVE FILE TEST</b><br><br>" +

    "Current URL:<br>" +
    currentURL.href +
    "<br><br>" +

    "Version parameter: " +
    (versionParameter || "none") +
    "<br><br>" +

    "Type parameter: " +
    (typeParameter || "none") +
    "<br><br>" +

    "Part parameter: " +
    (existingPart || "none") +
    "<br><br>" +

    "Detected mode: " +
    "<b>" +
    scanType.toUpperCase() +
    "</b>";


/*
====================================================
SHOW MODE
====================================================
*/

if (scanType === "tray") {

    document.getElementById("message").innerHTML =
        "📦 <b>TRAY QR MODE</b><br><br>" +
        "Part: " +
        existingPart;

} else {

    document.getElementById("message").innerHTML =
        "📷 <b>PART QR MODE</b>";

}


/*
====================================================
CREATE SCANNER
====================================================
*/

const scanner =
    new Html5Qrcode("reader");


/*
====================================================
QR SCAN SUCCESS
====================================================
*/

function onScanSuccess(decodedText) {

    const scannedValue =
        decodedText.trim();


    /*
    DO NOT REDIRECT.
    ONLY SHOW THE RESULT.
    */

    document.getElementById("message").innerHTML =

        "✅ QR SCANNED<br><br>" +

        "QR VALUE:<br>" +
        "<b>" +
        scannedValue +
        "</b>";


    document.getElementById("debug").innerHTML =

        "<b>SCAN RESULT</b><br><br>" +

        "QR Value: " +
        scannedValue +
        "<br><br>" +

        "Type parameter: " +
        (typeParameter || "none") +
        "<br><br>" +

        "Part parameter: " +
        (existingPart || "none") +
        "<br><br>" +

        "Detected mode: " +
        "<b>" +
        scanType.toUpperCase() +
        "</b>";

}


/*
====================================================
START CAMERA
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {


    if (!cameras || cameras.length === 0) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    Use first available camera
    */

    const cameraId =
        cameras[0].id;


    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )

    .then(function() {

        if (scanType === "tray") {

            document.getElementById("message").innerHTML =
                "📦 Point the camera at the TRAY QRRRR";

        } else {

            document.getElementById("message").innerHTML =
                "📷 Point the camera at the PART QRRRRRRR";

        }

    })

    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error:<br>" +
            error;

    });

})


.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera:<br>" +
        error;

});

</script>

</body>

</html>
