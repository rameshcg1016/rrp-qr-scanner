<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

}


body {

        Arial,

<body>


<div class="container">


<h2>

>

<script>


/*
============================================================
RRP APPS SCRIPT URL
============================================================
*/

const appURL =

    "https://script.google.com/macros/s/" +

    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +

    "/exec";


/*
============================================================
GITHUB SCANNER URL
============================================================
*/

const scannerURL =

    "https://rameshcg1016.github.io/rrp-qr-scanner/";


/*
============================================================
READ CURRENT URL
============================================================
*/

const currentURL =

    new URL(
        window.location.href
    );


const params =

    currentURL.searchParams;


/*
============================================================
SCAN TYPE
============================================================

SUPPORTED MODES:

part
partbasic
blankcutting
toolinfo
productiondetails
tray
production
batch
rubberbatch
sfgstore-inward
sfginspectionreturn
sfg-out

============================================================
*/

const scanType =

    params.get("type") || "part";



/*
============================================================
COVER COUNT
============================================================
*/

const coverCount = params.get("covers") || "";


/*
============================================================
EXISTING PART
============================================================
*/

const existingPart =

    params.get("part") || "";


/*
============================================================
SUPPLY DATA
============================================================
*/

const supplyDate =

    params.get("supplyDate") || "";


const suppliedKg =

    params.get("suppliedKg") || "";


const targetQty =

    params.get("targetQty") || "";


const remarks =

    params.get("remarks") || "";


/*
============================================================
SESSION TOKEN
============================================================
*/

let sessionToken =

    params.get("session") || "";


/*
============================================================
IF SESSION NOT IN URL
TRY LOCAL STORAGE
============================================================
*/

if (!sessionToken) {

    try {

        sessionToken =

            localStorage.getItem(
                "rrpSession"
            ) || "";

    }

    catch(error) {

        console.log(
            "Unable to read saved session."
        );

        sessionToken = "";

    }

}


/*
============================================================
SAVE SESSION
============================================================
*/

if (sessionToken) {

    try {

        localStorage.setItem(
            "rrpSession",
            sessionToken
        );

    }

    catch(error) {

        console.log(
            "Unable to save session."
        );

    }

}


/*
============================================================
SCANNER VARIABLES
============================================================
*/

let scanner = null;

let scanLocked = false;


/*
============================================================
SHOW SCAN MODE
============================================================
*/

function showScanMessage() {

    const message =

        document.getElementById(
            "message"
        );


    /*
    --------------------------------------------------------
    TRAY
    --------------------------------------------------------
    */

    if (
        scanType === "tray"
    ) {

        message.innerHTML =

            "📦 Point the camera at the TRAY QR";

    }


    /*
    --------------------------------------------------------
    RUBBER BATCH
    --------------------------------------------------------
    */

    else if (
        scanType === "rubberbatch"
    ) {

        message.innerHTML =

            "🧪 Point the camera at the RUBBER BATCH QR";

    }


    /*
    --------------------------------------------------------
    PRODUCTION
    --------------------------------------------------------
    */

    else if (
        scanType === "production"
    ) {

        message.innerHTML =

            "🏭 Point the camera at the SUPPLY QR";

    }


    /*
    --------------------------------------------------------
    BATCH
    --------------------------------------------------------
    */

    else if (
        scanType === "batch"
    ) {

        message.innerHTML =

            "🏷️ Point the camera at the SUPPLY QR";

    }


    /*
    --------------------------------------------------------
    SFG-OUT
    --------------------------------------------------------
    */

    else if (
        scanType === "sfg-out"
    ) {

        message.innerHTML =

            "📤 Point the camera at the PRODUCTION / BATCH QR";

    }


    /*
    --------------------------------------------------------
    PART BASIC INFO
    --------------------------------------------------------
    */

    else if (
        scanType === "partbasic"
    ) {

        message.innerHTML =

            "📋 Point the camera at the INTERNAL PART QR";

    }


    /*
    --------------------------------------------------------
    BLANK CUTTING INFO
    --------------------------------------------------------
    */

    else if (
        scanType === "blankcutting"
    ) {

        message.innerHTML =

            "✂️ Point the camera at the INTERNAL PART QR";

    }


    /*
    --------------------------------------------------------
    TOOL INFO
    --------------------------------------------------------
    */

    else if (
        scanType === "toolinfo"
    ) {

        message.innerHTML =

            "🔧 Point the camera at the INTERNAL PART QR";

    }


    /*
    --------------------------------------------------------
    PRODUCTION DETAILS
    --------------------------------------------------------
    */

    else if (
        scanType === "productiondetails"
    ) {

        message.innerHTML =

            "🏭 Point the camera at the INTERNAL PART QR";

    }


    /*
    --------------------------------------------------------
    SFG STORE INWARD
    --------------------------------------------------------
    */

    else if (
        scanType === "sfgstore-inward"
    ) {

        message.innerHTML =
            "📦 Point the camera at the PRODUCTION QR";

    }


    /*
    --------------------------------------------------------
    SFG INSPECTION RETURN
    --------------------------------------------------------
    */

    else if (
        scanType === "sfginspectionreturn"
    ) {

        message.innerHTML =
            "↩️ Point the camera at the PRODUCTION QR";

    }


    /*
    --------------------------------------------------------
    NORMAL PART
    --------------------------------------------------------
    */

    else {

        message.innerHTML =

            "📷 Point the camera at the PART QR";

    }

}


/*
============================================================
START REAR / BACK CAMERA
============================================================
*/

function startRearCamera() {

    const message = document.getElementById("message");

    if (!window.isSecureContext) {
        showError(
            "❌ Camera requires HTTPS.<br><br>" +
            "Please open the GitHub scanner using the HTTPS URL."
        );
        return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError(
            "❌ This browser does not support camera access."
        );
        return;
    }

    if (typeof Html5Qrcode === "undefined") {
        showError(
            "❌ QR scanner library did not load.<br><br>" +
            "Please refresh the page and try again."
        );
        return;
    }

    message.innerHTML = "📷 Requesting camera permission...";

    /*
    ------------------------------------------------------------
    STEP 1 - REQUEST CAMERA PERMISSION
    ------------------------------------------------------------
    This forces the browser to show the camera permission prompt.
    ------------------------------------------------------------
    */

    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: {
                ideal: "environment"
            }
        },
        audio: false
    })

    .then(function(stream) {

        /*
        --------------------------------------------------------
        Permission was granted.
        Stop this temporary stream because html5-qrcode
        will open the camera itself.
        --------------------------------------------------------
        */

        try {
            stream.getTracks().forEach(function(track) {
                track.stop();
            });
        }
        catch(error) {}

        message.innerHTML = "📷 Starting camera...";

        /*
        --------------------------------------------------------
        STEP 2 - GET AVAILABLE CAMERAS
        --------------------------------------------------------
        */

        return Html5Qrcode.getCameras();

    })

    .then(function(cameras) {

        if (!cameras || cameras.length === 0) {
            throw new Error("No camera was detected on this device.");
        }

        let rearCamera = null;

        /*
        --------------------------------------------------------
        Prefer rear / back / environment camera
        --------------------------------------------------------
        */

        for (let i = 0; i < cameras.length; i++) {

            const label =
                String(cameras[i].label || "").toLowerCase();

            if (
                label.indexOf("back") !== -1 ||
                label.indexOf("rear") !== -1 ||
                label.indexOf("environment") !== -1
            ) {
                rearCamera = cameras[i];
                break;
            }
        }

        if (!rearCamera) {
            rearCamera = cameras[0];
        }

        /*
        --------------------------------------------------------
        STEP 3 - CREATE SCANNER
        --------------------------------------------------------
        */

        scanner = new Html5Qrcode("reader");

        return scanner.start(
            rearCamera.id,
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                },
                aspectRatio: 1.0
            },
            onScanSuccess
        );

    })

    .then(function() {

        showScanMessage();

    })

    .catch(function(error) {

        console.error("Camera startup error:", error);

        let msg = String(
            error && error.message
                ? error.message
                : error
        );

        if (
            msg.toLowerCase().indexOf("permission") !== -1 ||
            msg.toLowerCase().indexOf("denied") !== -1 ||
            msg.toLowerCase().indexOf("notallowed") !== -1
        ) {
            msg =
                "Camera permission was denied.<br><br>" +
                "Please allow Camera permission for " +
                "rameshcg1016.github.io and refresh the page.";
        }

        showError(
            "❌ Unable to start camera.<br><br>" +
            escapeHtml(msg)
        );

    });
}


/*
============================================================
INITIALIZE SCANNER AFTER PAGE LOAD
============================================================
*/

window.addEventListener("load", function() {

    showScanMessage();

    setTimeout(function() {
        startRearCamera();
    }, 100);

});


/*
============================================================
QR SCAN SUCCESS
============================================================
*/

function onScanSuccess(
    decodedText
) {


    /*
    ========================================================
    PREVENT MULTIPLE SCANS
    ========================================================
    */

    if (
        scanLocked
    ) {

        return;

    }


    scanLocked = true;


    const scannedValue =

        decodedText.trim();


    /*
    ========================================================
    TRY TO INTERPRET QR AS URL
    ========================================================
    */

    let scannedURL = null;


    try {

        scannedURL =

            new URL(
                scannedValue
            );

    }

    catch(error) {

        scannedURL = null;

    }


    /*
    ========================================================
    PRODUCTION QR
    ========================================================
    */

    if (
        scanType === "production"
    ) {


        if (
            !scannedURL
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR generated by RRP."

            );

            scanLocked = false;

            return;

        }


        const qrPage =

            scannedURL.searchParams.get(
                "page"
            );


        const supplyID =

            scannedURL.searchParams.get(
                "id"
            );


        const qrPolymerCode =

            scannedURL.searchParams.get(
                "polymerCode"
            ) || "";


        const qrCustomerName =

            scannedURL.searchParams.get(
                "customerName"
            ) || "";


        const qrPartNumber =

            scannedURL.searchParams.get(
                "partNumber"
            ) || "";


        const qrInternalPartNumber =

            scannedURL.searchParams.get(
                "internalPartNumber"
            ) || "";


        const qrRubberSupplyDate =

            scannedURL.searchParams.get(
                "rubberSupplyDate"
            ) || "";

        if (

            qrPage !== "production" ||

            !supplyID

        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the correct Supply QR."

            );

            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                supplyID
            ) +

            "</b><br><br>" +

            "Opening Production Page..."

        );


        stopScanner();


        const productionURL =

            appURL +

            "?page=production" +

            "&id=" +

            encodeURIComponent(
                supplyID
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            ) +

            (
                qrPolymerCode
                    ? "&polymerCode=" +
                      encodeURIComponent(
                          qrPolymerCode
                      )
                    : ""
            ) +

            (
                qrCustomerName
                    ? "&customerName=" +
                      encodeURIComponent(
                          qrCustomerName
                      )
                    : ""
            ) +

            (
                qrPartNumber
                    ? "&partNumber=" +
                      encodeURIComponent(
                          qrPartNumber
                      )
                    : ""
            ) +

            (
                qrInternalPartNumber
                    ? "&internalPartNumber=" +
                      encodeURIComponent(
                          qrInternalPartNumber
                      )
                    : ""
            ) +

            (
                qrRubberSupplyDate
                    ? "&rubberSupplyDate=" +
                      encodeURIComponent(
                          qrRubberSupplyDate
                      )
                    : ""
            );


        setTimeout(

            function() {

                window.top.location.href =
                    productionURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    SFG-OUT QR
    ========================================================
    Accept existing production/batch QR URLs or query strings.
    Keep the original QR parameter names unchanged.
    ========================================================
    */

    if (
        scanType === "sfg-out"
    ) {

        let outURL = null;

        try {
            outURL = new URL(scannedValue);
        }
        catch (error1) {
            try {
                if (scannedValue.startsWith("?")) {
                    outURL = new URL(scannedValue, window.location.origin);
                } else {
                    outURL = new URL("?" + scannedValue, window.location.origin);
                }
            }
            catch (error2) {
                outURL = null;
            }
        }

        if (!outURL) {
            scanLocked = false;
            showError("❌ Invalid QR. Please scan a valid PRODUCTION / BATCH QR.");
            return;
        }

        const outParams = outURL.searchParams;
        const outPage = (outParams.get("page") || "").toLowerCase();
        const outBatchID = outParams.get("id") || outParams.get("batchId") || "";
        const outCustomerName = outParams.get("customerName") || "";
        const outPartNumber = outParams.get("partNumber") || "";
        const outInternalPartNumber = outParams.get("internalPartNumber") || "";

        if (!["production", "batch"].includes(outPage) || !outBatchID) {
            scanLocked = false;
            showError("❌ Invalid Production QR. The QR must contain page=production or page=batch and an ID.");
            return;
        }

        const redirectURL =
            appURL +
            "?page=sfg-out" +
            "&id=" + encodeURIComponent(outBatchID) +
            "&customerName=" + encodeURIComponent(outCustomerName) +
            "&partNumber=" + encodeURIComponent(outPartNumber) +
            "&internalPartNumber=" + encodeURIComponent(outInternalPartNumber) +
            "&session=" + encodeURIComponent(sessionToken);

        document.getElementById("message").innerHTML =
            "✅ QR scanned. Opening SFG-OUT...";

        if (typeof html5QrcodeScanner !== "undefined" && html5QrcodeScanner) {
            try { html5QrcodeScanner.clear(); } catch (e) {}
        }

        window.location.href = redirectURL;
        return;
    }


    /*
    ========================================================
    SFG STORE INWARD QR
    ========================================================

    READ THE EXISTING PRODUCTION QR WITHOUT CHANGING
    ANY QR PARAMETER NAMES.

    REQUIRED PARAMETERS:

    page=production
    id
    customerName
    partNumber
    internalPartNumber
    actualQty
    productionDate

    The QR may be:
      1. A complete URL
      2. A URL/query string beginning with ?
      3. A query string without ?
    ========================================================
    */

    if (
        scanType === "sfgstore-inward"
    ) {

        /*
        ----------------------------------------------------
        BUILD A URL FROM THE SCANNED QR
        ----------------------------------------------------
        */

        let sfgURLObject = null;

        try {

            /*
            First: normal complete URL
            */
            sfgURLObject =
                new URL(
                    scannedValue
                );

        }

        catch(error1) {

            try {

                /*
                Second: QR contains ?page=...
                */
                if (
                    scannedValue.charAt(0) === "?"
                ) {

                    sfgURLObject =
                        new URL(
                            "https://rrp.local/" +
                            scannedValue
                        );

                }

                else if (
                    scannedValue.indexOf("=") !== -1
                ) {

                    /*
                    Third: QR contains only query parameters,
                    for example:

                    page=production&id=...&customerName=...
                    */
                    sfgURLObject =
                        new URL(
                            "https://rrp.local/?" +
                            scannedValue
                        );

                }

            }

            catch(error2) {

                sfgURLObject = null;

            }

        }


        /*
        ----------------------------------------------------
        VALIDATE QR FORMAT
        ----------------------------------------------------
        */

        if (
            !sfgURLObject
        ) {

            showError(
                "❌ Invalid Production / Batch QR.<br><br>" +
                "The QR data could not be read as a URL or " +
                "query parameter string."
            );

            scanLocked = false;

            return;

        }


        /*
        ----------------------------------------------------
        READ THE EXISTING QR PARAMETERS
        ----------------------------------------------------
        */

        const sfgQRPage =
            sfgURLObject.searchParams.get(
                "page"
            ) || "";

        const sfgBatchID =
            sfgURLObject.searchParams.get(
                "id"
            ) || "";

        const sfgCustomerName =
            sfgURLObject.searchParams.get(
                "customerName"
            ) || "";

        const sfgPartNumber =
            sfgURLObject.searchParams.get(
                "partNumber"
            ) || "";

        const sfgInternalPartNumber =
            sfgURLObject.searchParams.get(
                "internalPartNumber"
            ) || "";

        const sfgActualQty =
            sfgURLObject.searchParams.get(
                "actualQty"
            ) || "";

        const sfgProductionDate =
            sfgURLObject.searchParams.get(
                "productionDate"
            ) || "";


        /*
        ----------------------------------------------------
        VALIDATE EXISTING PRODUCTION QR
        ----------------------------------------------------
        */

        const missingFields = [];

        if (
            sfgQRPage !== "production" &&
            sfgQRPage !== "batch"
        ) {

            missingFields.push(
                "page=production or page=batch"
            );

        }

        if (
            !sfgBatchID
        ) {

            missingFields.push(
                "Batch ID (id)"
            );

        }

        if (
            !sfgCustomerName
        ) {

            missingFields.push(
                "Customer Name (customerName)"
            );

        }

        if (
            !sfgPartNumber
        ) {

            missingFields.push(
                "Part Number (partNumber)"
            );

        }

        if (
            !sfgInternalPartNumber
        ) {

            missingFields.push(
                "Internal Part Code (internalPartNumber)"
            );

        }

        if (
            !sfgActualQty
        ) {

            missingFields.push(
                "Actual Qty (actualQty)"
            );

        }

        if (
            !sfgProductionDate
        ) {

            missingFields.push(
                "Production Date (productionDate)"
            );

        }


        if (
            missingFields.length > 0
        ) {

            showError(
                "❌ Invalid Production QR.<br><br>" +
                "Missing or invalid:<br>" +
                missingFields
                    .map(
                        function(field) {
                            return "• " +
                                escapeHtml(field);
                        }
                    )
                    .join("<br>") +
                "<br><br>" +
                "QR data received:<br>" +
                "<small>" +
                escapeHtml(
                    scannedValue
                ) +
                "</small>"
            );

            scanLocked = false;

            return;

        }


        /*
        ----------------------------------------------------
        SHOW SUCCESS
        ----------------------------------------------------
        */

        showSuccess(
            "✅ " +
            (sfgQRPage === "batch"
                ? "BATCH QR SCANNED<br><br>"
                : "PRODUCTION QR SCANNED<br><br>") +
            "Batch ID: <b>" +
            escapeHtml(
                sfgBatchID
            ) +
            "</b><br><br>" +
            "Opening SFG Store Inward..."
        );


        /*
        ----------------------------------------------------
        STOP CAMERA
        ----------------------------------------------------
        */

        stopScanner();


        /*
        ----------------------------------------------------
        CREATE SFG STORE INWARD URL
        ----------------------------------------------------
        */

        const sfgURL =
            appURL +
            "?page=sfgstore-inward" +
            "&id=" +
            encodeURIComponent(
                sfgBatchID
            ) +
            "&customerName=" +
            encodeURIComponent(
                sfgCustomerName
            ) +
            "&partNumber=" +
            encodeURIComponent(
                sfgPartNumber
            ) +
            "&internalPartNumber=" +
            encodeURIComponent(
                sfgInternalPartNumber
            ) +
            "&actualQty=" +
            encodeURIComponent(
                sfgActualQty
            ) +
            "&productionDate=" +
            encodeURIComponent(
                sfgProductionDate
            ) +
            "&session=" +
            encodeURIComponent(
                sessionToken
            );


        /*
        ----------------------------------------------------
        OPEN SFG STORE INWARD
        ----------------------------------------------------
        */

        setTimeout(
            function() {

                window.top.location.href =
                    sfgURL;

            },
            500
        );


        return;

    }


    /*
    ========================================================
    SFG INSPECTION RETURN QR
    ========================================================

    Uses the SAME production/batch QR format as SFG Store Inward.

    Required QR parameters:
      page=production OR page=batch
      id
      customerName
      partNumber
      internalPartNumber

    actualQty and productionDate are read when available but are
    NOT used as the inspection-return quantity. The return Qty
    is entered by the user on the SFG Inspection Return page.
    ========================================================
    */

    if (
        scanType === "sfginspectionreturn"
    ) {

        let returnURLObject = null;

        try {
            returnURLObject = new URL(scannedValue);
        }
        catch (error1) {
            try {
                if (scannedValue.charAt(0) === "?") {
                    returnURLObject = new URL(
                        "https://rrp.local/" + scannedValue
                    );
                }
                else if (scannedValue.indexOf("=") !== -1) {
                    returnURLObject = new URL(
                        "https://rrp.local/?" + scannedValue
                    );
                }
            }
            catch (error2) {
                returnURLObject = null;
            }
        }

        if (!returnURLObject) {
            showError(
                "❌ Invalid Production / Batch QR.<br><br>" +
                "The QR data could not be read as a URL or query parameter string."
            );
            scanLocked = false;
            return;
        }

        const returnQRPage =
            returnURLObject.searchParams.get("page") || "";

        const returnBatchID =
            returnURLObject.searchParams.get("id") || "";

        const returnCustomerName =
            returnURLObject.searchParams.get("customerName") || "";

        const returnPartNumber =
            returnURLObject.searchParams.get("partNumber") || "";

        const returnInternalPartNumber =
            returnURLObject.searchParams.get("internalPartNumber") || "";

        const returnActualQty =
            returnURLObject.searchParams.get("actualQty") || "";

        const returnProductionDate =
            returnURLObject.searchParams.get("productionDate") || "";

        const returnMissingFields = [];

        if (
            returnQRPage !== "production" &&
            returnQRPage !== "batch"
        ) {
            returnMissingFields.push("page=production or page=batch");
        }

        if (!returnBatchID) {
            returnMissingFields.push("Batch ID (id)");
        }

        if (!returnCustomerName) {
            returnMissingFields.push("Customer Name (customerName)");
        }

        if (!returnPartNumber) {
            returnMissingFields.push("Part Number (partNumber)");
        }

        if (!returnInternalPartNumber) {
            returnMissingFields.push(
                "Internal Part Code (internalPartNumber)"
            );
        }

        if (returnMissingFields.length > 0) {
            showError(
                "❌ Invalid Production QR.<br><br>" +
                "Missing or invalid:<br>" +
                returnMissingFields.map(function(field) {
                    return "• " + escapeHtml(field);
                }).join("<br>") +
                "<br><br>QR data received:<br><small>" +
                escapeHtml(scannedValue) +
                "</small>"
            );
            scanLocked = false;
            return;
        }

        showSuccess(
            "✅ PRODUCTION QR SCANNED<br><br>" +
            "Batch ID: <b>" +
            escapeHtml(returnBatchID) +
            "</b><br><br>" +
            "Opening SFG Inspection Return..."
        );

        stopScanner();

        const inspectionReturnURL =
            appURL +
            "?page=sfginspectionreturn" +
            "&id=" + encodeURIComponent(returnBatchID) +
            "&customerName=" + encodeURIComponent(returnCustomerName) +
            "&partNumber=" + encodeURIComponent(returnPartNumber) +
            "&internalPartNumber=" + encodeURIComponent(returnInternalPartNumber) +
            (returnActualQty
                ? "&actualQty=" + encodeURIComponent(returnActualQty)
                : "") +
            (returnProductionDate
                ? "&productionDate=" + encodeURIComponent(returnProductionDate)
                : "") +
            "&session=" + encodeURIComponent(sessionToken);

        setTimeout(function() {
            window.top.location.href = inspectionReturnURL;
        }, 500);

        return;
    }


    /*
    ========================================================
    PART BASIC INFO QR
    ========================================================

    QR VALUE IS DIRECTLY THE
    INTERNAL PART NUMBER.

    Example:

    RRP-PART-001

    Opens:

    ?page=partbasicinfo
    &internalPart=RRP-PART-001

    ========================================================
    */

    if (
        scanType === "partbasic"
    ) {


        if (
            !scannedValue
        ) {

            showError(

                "❌ Empty Part QR.<br><br>" +

                "Please scan a valid Internal Part QR."

            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ PART QR SCANNED<br><br>" +

            "Internal Part Number: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Opening Part Basic Info..."

        );


        stopScanner();


        const partBasicURL =

            appURL +

            "?page=partbasicinfo" +

            "&internalPart=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.top.location.href =

                    partBasicURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BLANK CUTTING INFO QR
    ========================================================

    QR VALUE IS DIRECTLY THE
    INTERNAL PART NUMBER.

    Example:

    RRP-PART-001

    Opens:

    ?page=blankcuttinginfo
    &internalPart=RRP-PART-001

    ========================================================
    */

    if (
        scanType === "blankcutting"
    ) {


        /*
        ----------------------------------------------------
        VALIDATE
        ----------------------------------------------------
        */

        if (
            !scannedValue
        ) {

            showError(

                "❌ Empty Part QR.<br><br>" +

                "Please scan a valid Internal Part QR."

            );


            scanLocked = false;

            return;

        }


        /*
        ----------------------------------------------------
        SHOW SUCCESS
        ----------------------------------------------------
        */

        showSuccess(

            "✅ PART QR SCANNED<br><br>" +

            "Internal Part Number: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Opening Blank Cutting Info..."

        );


        /*
        ----------------------------------------------------
        STOP CAMERA
        ----------------------------------------------------
        */

        stopScanner();


        /*
        ----------------------------------------------------
        CREATE BLANK CUTTING URL
        ----------------------------------------------------
        */

        const blankCuttingURL =

            appURL +

            "?page=blankcuttinginfo" +

            "&internalPart=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        /*
        ----------------------------------------------------
        OPEN BLANK CUTTING PAGE
        ----------------------------------------------------
        */

        setTimeout(

            function() {

                window.top.location.href =

                    blankCuttingURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    TOOL INFO QR
    ========================================================

    QR VALUE IS DIRECTLY THE
    INTERNAL PART NUMBER.

    Opens:

    ?page=toolinfo
    &internalPart=RRP-PART-001

    ========================================================
    */

    if (
        scanType === "toolinfo"
    ) {

        if (
            !scannedValue
        ) {

            showError(

                "❌ Empty Part QR.<br><br>" +

                "Please scan a valid Internal Part QR."

            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ PART QR SCANNED<br><br>" +

            "Internal Part Number: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Opening Tool Info..."

        );


        stopScanner();


        const toolInfoURL =

            appURL +

            "?page=toolinfo" +

            "&internalPart=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.top.location.href =

                    toolInfoURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    PRODUCTION DETAILS QR
    ========================================================
    */

    if (
        scanType === "productiondetails"
    ) {

        if (
            !scannedValue
        ) {

            showError(

                "❌ Empty Part QR.<br><br>" +

                "Please scan a valid Internal Part QR."

            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ PART QR SCANNED<br><br>" +

            "Internal Part Number: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Opening Production Details..."

        );


        stopScanner();


        const productionDetailsURL =

            appURL +

            "?page=productiondetails" +

            "&internalPart=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.top.location.href =

                    productionDetailsURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    EXISTING PART QR
    ========================================================
    */

    if (
        scanType === "part"
    ) {


        showSuccess(

            "✅ Part QR scanned<br><br>" +

            "Part: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Loading Supply Page..."

        );


        stopScanner();


        const partURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.top.location.href =
                    partURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    RUBBER BATCH QR
    ========================================================
    */

    if (
        scanType === "rubberbatch"
    ) {

        if (
            !existingPart
        ) {

            showError(
                "❌ Part number is missing."
            );

            scanLocked = false;

            return;

        }


        if (
            !scannedValue
        ) {

            showError(
                "❌ Rubber Batch QR is empty."
            );

            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ RUBBER BATCH QR SCANNED<br><br>" +
            "Returning to Supply Page..."

        );


        stopScanner();


        const rubberBatchURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                existingPart
            ) +

            "&rubberBatch=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +

            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +

            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +

            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +

            encodeURIComponent(
                remarks
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.top.location.href =
                    rubberBatchURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    TRAY QR
    ========================================================
    */

    if (
        scanType === "tray"
    ) {


        if (
            !existingPart
        ) {

            showError(
                "❌ Part number is missing."
            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ Tray QR scanned<br><br>" +

            "Tray: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Returning to Supply Page..."

        );


        stopScanner();


        const trayURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                existingPart
            ) +

            "&tray=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +

            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +

            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +

            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +

            encodeURIComponent(
                remarks
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.top.location.href =
                    trayURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BATCH / SUPPLY QR
    ========================================================
    */

    if (
        scanType === "batch"
    ) {


        if (
            !scannedURL
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR."

            );


            scanLocked = false;

            return;

        }


        const batchQRPage =

            scannedURL.searchParams.get(
                "page"
            );


        const batchSupplyID =

            scannedURL.searchParams.get(
                "id"
            );


        const batchRubberBatchCodes =

            scannedURL.searchParams.get(

                "rubberBatchCodes"

            ) || "";



        
        const batchCustomerName =
            scannedURL.searchParams.get(
                "customerName"
            ) || "";

        const batchPartNumber =
            scannedURL.searchParams.get(
                "partNumber"
            ) || "";

        const batchInternalPartNumber =
            scannedURL.searchParams.get(
                "internalPartNumber"
            ) || "";

        const batchRubberSupplyDate =
            scannedURL.searchParams.get(
                "rubberSupplyDate"
            ) || "";

if (

            batchQRPage !== "production" ||

            !batchSupplyID

        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "The QR must contain a valid Supply ID."

            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                batchSupplyID
            ) +

            "</b><br><br>" +

            "Opening Batch Create Page..."

        );


        stopScanner();


        const batchURL =

            appURL +

            "?page=batchcreate" +

            "&scan=" +

            encodeURIComponent(
                batchSupplyID
            ) +



            "&covers=" +



            encodeURIComponent(



                coverCount



            ) +

             "&fmbid=" +

            encodeURIComponent(

                batchSupplyID

            ) +

            "&rubberBatchCodes=" +

            encodeURIComponent(

                batchRubberBatchCodes

            ) +

            
            "&customerName=" +
            encodeURIComponent(
                batchCustomerName
            ) +

            "&partNumber=" +
            encodeURIComponent(
                batchPartNumber
            ) +

            "&internalPartNumber=" +
            encodeURIComponent(
                batchInternalPartNumber
            ) +

            "&rubberSupplyDate=" +
            encodeURIComponent(
                batchRubberSupplyDate
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.top.location.href =
                    batchURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    UNKNOWN SCAN MODE
    ========================================================
    */

    showError(

        "❌ Unknown scan mode: <b>" +

        escapeHtml(
            scanType
        ) +

        "</b><br><br>" +

        "Please return to RRP Part Information and try again."

    );


    scanLocked = false;

}


/*
============================================================
STOP SCANNER
============================================================
*/

function stopScanner() {

    if (
        scanner
    ) {

        scanner.stop()

            .catch(
                function() {}
            );

    }

}


/*
============================================================
SHOW ERROR
============================================================
*/

function showError(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "error";

}


/*
============================================================
SHOW SUCCESS
============================================================
*/

function showSuccess(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "success";

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHtml(
    value
) {

    return String(

        value == null

            ? ""

            : value

    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
