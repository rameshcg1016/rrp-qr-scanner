<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
}

</style>

</head>


<body>

<div class="container">

<h2>RRP QR SCANNER</h2>

<div id="reader"></div>

<div id="message">
Starting camera...
</div>

</div>


<script>

/*
====================================================
CREATE SCANNER
====================================================
*/

const scanner = new Html5Qrcode("reader");


/*
====================================================
GET SCANNER PARAMETERS
====================================================
*/

function getScanParameters() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return {

        type:
            params.get("type") || "part",

        part:
            params.get("part") || ""

    };

}


/*
====================================================
SHOW SCANNER MODE
====================================================
*/

const initialParams =
    getScanParameters();


if (initialParams.type === "tray") {

    document.getElementById("message").innerHTML =
        "📦 Point camera at TRAY QR";

} else {

    document.getElementById("message").innerHTML =
        "📷 Point camera at PART QR";

}


/*
====================================================
QR SCAN SUCCESS
====================================================
*/

function onScanSuccess(decodedText) {

    const scannedValue =
        decodedText.trim();


    /*
    Get URL parameters AGAIN.
    This is important for Tray scanning.
    */

    const scanParams =
        getScanParameters();


    const scanType =
        scanParams.type;

    const existingPart =
        scanParams.part;


    /*
    ================================================
    SHOW WHAT WAS SCANNED
    ================================================
    */

    document.getElementById("message").innerHTML =
        "Scanned: " +
        scannedValue;


    /*
    Stop camera
    */

    scanner.stop()

    .then(function() {

        redirectAfterScan(
            scannedValue,
            scanType,
            existingPart
        );

    })

    .catch(function() {

        redirectAfterScan(
            scannedValue,
            scanType,
            existingPart
        );

    });

}


/*
====================================================
REDIRECT AFTER SCAN
====================================================
*/

function redirectAfterScan(
    scannedValue,
    scanType,
    existingPart
) {


    /*
    ================================================
    APPS SCRIPT WEB APP URL
    ================================================
    */

    const appURL =
        "https://script.google.com/macros/s/" +
        "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
        "/exec";


    /*
    ================================================
    PART QR
    ================================================
    */

    if (scanType === "part") {


        const partURL =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(
                scannedValue
            );


        window.location.href =
            partURL;


        return;

    }


    /*
    ================================================
    TRAY QR
    ================================================
    */

    if (scanType === "tray") {


        /*
        Make sure the original Part
        was received.
        */

        if (!existingPart) {

            document.getElementById("message").innerHTML =
                "❌ Part number is missing.";

            return;

        }


        /*
        Create URL containing:

        page=supply
        part=MND-RRP-0001
        tray=1
        */

        const trayURL =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(
                existingPart
            ) +
            "&tray=" +
            encodeURIComponent(
                scannedValue
            );


        /*
        SHOW URL BEFORE REDIRECT
        */

        document.getElementById("message").innerHTML =
            "Tray scanned successfully.<br><br>" +
            "Tray: <b>" +
            scannedValue +
            "</b><br><br>" +
            "Returning to Supply Page...";


        /*
        Small delay so we know
        the correct branch executed.
        */

        setTimeout(function() {

            window.location.href =
                trayURL;

        }, 800);


        return;

    }


    /*
    ================================================
    UNKNOWN SCAN TYPE
    ================================================
    */

    document.getElementById("message").innerHTML =
        "❌ Unknown scan type: " +
        scanType;

}


/*
====================================================
START CAMERA
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {


    if (
        !cameras ||
        cameras.length === 0
    ) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    Use first available camera.
    */

    const cameraId =
        cameras[0].id;


    /*
    ================================================
    START
    ================================================
    */

    scanner.start(

        cameraId,

        {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            }

        },

        onScanSuccess

    )


    .then(function() {


        const scanParams =
            getScanParameters();


        if (
            scanParams.type === "tray"
        ) {

            document.getElementById("message").innerHTML =
                "📦 Point camera at TRAY QR";

        } else {

            document.getElementById("message").innerHTML =
                "📷 Point camera at PART QR";

        }

    })


    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error: " +
            error;

    });

})


.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera: " +
        error;

});

</script>

</body>

</html>
