<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    font-size: 16px;
}

</style>

</head>


<body>

<div class="container">

<h2>RRP QR SCANNER</h2>

<div id="reader"></div>

<div id="message">
Starting camera...
</div>

</div>


<script>

/*
====================================================
READ URL PARAMETERS
====================================================
*/

const currentURL =
    new URL(window.location.href);

const params =
    currentURL.searchParams;


/*
====================================================
GET EXISTING PART
====================================================
*/

const existingPart =
    params.get("part") || "";


/*
====================================================
DETERMINE SCAN MODE
====================================================

NO "part" PARAMETER
        =
PART SCAN

"part" PARAMETER EXISTS
        =
TRAY SCAN

*/

const scanType =
    existingPart.trim() !== ""
        ? "tray"
        : "part";


/*
====================================================
APPS SCRIPT WEB APP URL
====================================================
*/

const appURL =
    "https://script.google.com/macros/s/" +
    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
    "/exec";


/*
====================================================
SHOW SCAN MODE
====================================================
*/

if (scanType === "tray") {

    document.getElementById("message").innerHTML =
        "📦 Point the camera at the TRAY QR";

} else {

    document.getElementById("message").innerHTML =
        "📷 Point the camera at the PART QR";

}


/*
====================================================
CREATE SCANNER
====================================================
*/

const scanner =
    new Html5Qrcode("reader");


/*
====================================================
PREVENT MULTIPLE SCANS
====================================================
*/

let scanLocked = false;


/*
====================================================
QR SCAN SUCCESS
====================================================
*/

function onScanSuccess(decodedText) {

    if (scanLocked) {
        return;
    }

    scanLocked = true;


    const scannedValue =
        decodedText.trim();


    /*
    ================================================
    PART QR
    ================================================
    */

    if (scanType === "part") {

        document.getElementById("message").innerHTML =
            "✅ Part QR scanned<br><br>" +
            "Part: <b>" +
            scannedValue +
            "</b><br><br>" +
            "Loading...";


        scanner.stop().catch(function() {});


        /*
        Build Supply Page URL
        */

        const partURL =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(scannedValue);


        /*
        Redirect to Supply Page
        */

        setTimeout(function() {

            window.location.href =
                partURL;

        }, 500);


        return;
    }


    /*
    ================================================
    TRAY QR
    ================================================
    */

    if (scanType === "tray") {


        /*
        Make sure Part Number exists
        */

        if (!existingPart) {

            document.getElementById("message").innerHTML =
                "❌ Part number is missing.";

            scanLocked = false;

            return;
        }


        document.getElementById("message").innerHTML =
            "✅ Tray QR scanned<br><br>" +
            "Tray: <b>" +
            scannedValue +
            "</b><br><br>" +
            "Returning to Supply Page...";


        scanner.stop().catch(function() {});


        /*
        Build final Supply Page URL
        */

        const trayURL =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(existingPart) +
            "&tray=" +
            encodeURIComponent(scannedValue);


        /*
        Redirect to Supply Page
        */

        setTimeout(function() {

            window.location.href =
                trayURL;

        }, 500);


        return;
    }


    /*
    ================================================
    UNKNOWN MODE
    ================================================
    */

    document.getElementById("message").innerHTML =
        "❌ Unknown scan mode.";

}


/*
====================================================
GET AVAILABLE CAMERAS
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {


    if (!cameras || cameras.length === 0) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    Use first available camera
    */

    const cameraId =
        cameras[0].id;


    /*
    ================================================
    START CAMERA
    ================================================
    */

    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )


    .then(function() {

        if (scanType === "tray") {

            document.getElementById("message").innerHTML =
                "📦 Point the camera at the TRAY QR";

        } else {

            document.getElementById("message").innerHTML =
                "📷 Point the camera at the PART QR";

        }

    })


    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error:<br>" +
            error;

    });

})


.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera:<br>" +
        error;

});

</script>

</body>

</html>
