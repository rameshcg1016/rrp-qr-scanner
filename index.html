<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    margin: 0;

    padding: 20px;

    background: #f2f2f2;

}


.container {

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 12px;

}


h2 {

    text-align: center;

    margin-top: 5px;

}


#reader {

    width: 100%;

    margin-top: 20px;

}


#message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

    word-break: break-word;

    line-height: 1.5;

}


.error {

    color: #c62828;

}


.success {

    color: #2e7d32;

}


.info {

    color: #555;

}

</style>

</head>


<body>


<div class="container">

    <h2>
        RRP QR SCANNER
    </h2>

    <div id="reader"></div>

    <div id="message"
         class="info">

        Starting...

    </div>

</div>


<script>


/*
============================================================
RRP APPS SCRIPT URL
============================================================
*/

const appURL =

    "https://script.google.com/macros/s/" +

    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +

    "/exec";


/*
============================================================
GITHUB SCANNER URL
============================================================
*/

const scannerURL =

    "https://rameshcg1016.github.io/rrp-qr-scanner/";


/*
============================================================
CURRENT URL
============================================================
*/

const currentURL =

    new URL(
        window.location.href
    );


const params =

    currentURL.searchParams;


/*
============================================================
GATEWAY MODE
============================================================

Possible values:

gateway
gateway-login

============================================================
*/

const gatewayMode =

    params.get("mode") || "";


/*
============================================================
GATEWAY TARGET
============================================================

The QR contains:

?mode=gateway&target=BASE64

============================================================
*/

const encodedTarget =

    params.get("target") || "";


/*
============================================================
GATEWAY SESSION
============================================================

Returned from LoginPage after successful login.

============================================================
*/

const gatewaySession =

    params.get("session") || "";


/*
============================================================
NORMAL SCANNER PARAMETERS
============================================================
*/

const scanType =

    params.get("type") || "part";


const existingPart =

    params.get("part") || "";


const supplyDate =

    params.get("supplyDate") || "";


const suppliedKg =

    params.get("suppliedKg") || "";


const targetQty =

    params.get("targetQty") || "";


const remarks =

    params.get("remarks") || "";


/*
============================================================
SESSION
============================================================
*/

let sessionToken =

    params.get("session") || "";


/*
============================================================
READ SAVED GITHUB SESSION
============================================================
*/

if (!sessionToken) {

    try {

        sessionToken =

            localStorage.getItem(
                "rrpSession"
            ) || "";

    }

    catch(error) {

        console.log(
            "Unable to read local session:",
            error
        );

        sessionToken = "";

    }

}


/*
============================================================
SAVE SESSION
============================================================
*/

function saveSession(
    token
) {

    if (!token) {

        return;

    }


    try {

        localStorage.setItem(
            "rrpSession",
            token
        );

    }

    catch(error) {

        console.log(
            "Unable to save session:",
            error
        );

    }

}


/*
============================================================
GET TARGET URL FROM BASE64
============================================================
*/

function getTargetURL() {

    if (!encodedTarget) {

        return "";

    }


    try {

        return atob(
            encodedTarget
        );

    }

    catch(error) {

        /*
        ----------------------------------------------------
        Try URI decoded value if necessary
        ----------------------------------------------------
        */

        try {

            return atob(
                decodeURIComponent(
                    encodedTarget
                )
            );

        }

        catch(error2) {

            console.error(
                "Target decode failed:",
                error2
            );

            return "";

        }

    }

}


/*
============================================================
ADD / REPLACE SESSION
============================================================
*/

function addSessionToURL(
    targetURL,
    token
) {

    if (!targetURL) {

        return "";

    }


    try {

        const url =

            new URL(
                targetURL
            );


        /*
        ----------------------------------------------------
        REMOVE ANY OLD SESSION
        ----------------------------------------------------
        */

        url.searchParams.delete(
            "session"
        );


        /*
        ----------------------------------------------------
        ADD NEW SESSION
        ----------------------------------------------------
        */

        if (token) {

            url.searchParams.set(
                "session",
                token
            );

        }


        return url.toString();

    }

    catch(error) {

        console.error(
            "Unable to add session:",
            error
        );

        return targetURL;

    }

}


/*
============================================================
OPEN TARGET AFTER GATEWAY LOGIN
============================================================
*/

function openGatewayTarget() {


    const targetURL =

        getTargetURL();


    /*
    --------------------------------------------------------
    TARGET MISSING
    --------------------------------------------------------
    */

    if (!targetURL) {

        showError(
            "❌ Gateway target URL is missing."
        );

        return;

    }


    /*
    ========================================================
    SESSION EXISTS
    ========================================================
    */

    if (sessionToken) {


        showSuccess(

            "✅ Existing RRP session found.<br><br>" +

            "Opening RRP ERP..."

        );


        const finalURL =

            addSessionToURL(
                targetURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    finalURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    NO SESSION
    ========================================================
    */

    showInfo(

        "No active RRP session found.<br><br>" +

        "Opening RRP Login..."

    );


    /*
    --------------------------------------------------------
    BUILD LOGIN URL
    --------------------------------------------------------
    */

    let loginURL =

        targetURL;


    try {

        const url =

            new URL(
                targetURL
            );


        /*
        The Apps Script login page will send the
        session back to this GitHub Gateway.
        */

        url.searchParams.set(
            "rrpGateway",
            "1"
        );


        url.searchParams.set(
            "gatewayReturn",
            scannerURL
        );


        loginURL =
            url.toString();

    }

    catch(error) {

        /*
        Fallback if target is not a valid URL.
        */

        loginURL =

            targetURL +

            (
                targetURL.indexOf("?") >= 0
                    ? "&"
                    : "?"
            ) +

            "rrpGateway=1" +

            "&gatewayReturn=" +

            encodeURIComponent(
                scannerURL
            );

    }


    /*
    --------------------------------------------------------
    OPEN LOGIN / TARGET
    --------------------------------------------------------
    */

    setTimeout(

        function() {

            window.location.href =
                loginURL;

        },

        500

    );

}


/*
============================================================
GATEWAY LOGIN CALLBACK
============================================================

LoginPage redirects here:

?mode=gateway-login
&session=XXXXXXXX
&target=BASE64

============================================================
*/

function handleGatewayLogin() {


    /*
    --------------------------------------------------------
    CHECK SESSION
    --------------------------------------------------------
    */

    if (gatewaySession) {

        sessionToken =
            gatewaySession;


        saveSession(
            gatewaySession
        );

    }


    /*
    --------------------------------------------------------
    DECODE TARGET
    --------------------------------------------------------
    */

    let targetURL =

        getTargetURL();


    if (!targetURL) {

        showError(
            "❌ Gateway target is missing."
        );

        return;

    }


    /*
    --------------------------------------------------------
    SESSION MUST EXIST
    --------------------------------------------------------
    */

    if (!sessionToken) {

        showError(

            "❌ Login session was not received."

        );

        return;

    }


    /*
    --------------------------------------------------------
    ADD SESSION
    --------------------------------------------------------
    */

    targetURL =

        addSessionToURL(
            targetURL,
            sessionToken
        );


    /*
    --------------------------------------------------------
    SHOW SUCCESS
    --------------------------------------------------------
    */

    showSuccess(

        "✅ Login successful.<br><br>" +

        "Session saved.<br><br>" +

        "Opening RRP ERP..."

    );


    /*
    --------------------------------------------------------
    OPEN TARGET
    --------------------------------------------------------
    */

    setTimeout(

        function() {

            window.location.href =
                targetURL;

        },

        700

    );

}


/*
============================================================
RUN GATEWAY BEFORE CAMERA
============================================================
*/

if (
    gatewayMode === "gateway"
) {


    /*
    IMPORTANT:
    Do NOT create or start camera.
    */

    openGatewayTarget();

}


else if (
    gatewayMode === "gateway-login"
) {


    /*
    IMPORTANT:
    Do NOT create or start camera.
    */

    handleGatewayLogin();

}


else {


    /*
    ========================================================
    NORMAL QR SCANNER
    ========================================================
    */

    startNormalScanner();

}


/*
============================================================
NORMAL SCANNER
============================================================
*/

function startNormalScanner() {


    /*
    --------------------------------------------------------
    INITIAL MESSAGE
    --------------------------------------------------------
    */

    showScanMessage();


    /*
    --------------------------------------------------------
    CREATE SCANNER
    --------------------------------------------------------
    */

    let scanner =

        new Html5Qrcode(
            "reader"
        );


    let scanLocked = false;


    /*
    --------------------------------------------------------
    START CAMERA
    --------------------------------------------------------
    */

    Html5Qrcode.getCameras()

        .then(

            function(cameras) {


                if (
                    !cameras ||
                    cameras.length === 0
                ) {

                    showError(
                        "❌ No camera found."
                    );

                    return;

                }


                /*
                ------------------------------------------------
                USE FIRST CAMERA
                ------------------------------------------------
                */

                const cameraId =

                    cameras[0].id;


                /*
                ------------------------------------------------
                START
                ------------------------------------------------
                */

                scanner.start(

                    cameraId,

                    {

                        fps: 10,

                        qrbox: {

                            width: 250,

                            height: 250

                        }

                    },

                    function(decodedText) {


                        /*
                        ========================================
                        PREVENT MULTIPLE SCANS
                        ========================================
                        */

                        if (
                            scanLocked
                        ) {

                            return;

                        }


                        scanLocked = true;


                        onScanSuccess(

                            decodedText,

                            scanner

                        );

                    }

                )


                .then(

                    function() {

                        showScanMessage();

                    }

                )


                .catch(

                    function(error) {

                        showError(

                            "❌ Camera error:<br>" +

                            escapeHtml(
                                error
                            )

                        );

                    }

                );

            }

        )

        .catch(

            function(error) {

                showError(

                    "❌ Unable to access camera:<br>" +

                    escapeHtml(
                        error
                    )

                );

            }

        );

}


/*
============================================================
SHOW SCAN MODE
============================================================
*/

function showScanMessage() {


    const message =

        document.getElementById(
            "message"
        );


    if (
        scanType === "tray"
    ) {

        message.innerHTML =

            "📦 Point the camera at the TRAY QR";

    }

    else if (
        scanType === "production"
    ) {

        message.innerHTML =

            "🏭 Point the camera at the SUPPLY QR";

    }

    else if (
        scanType === "batch"
    ) {

        message.innerHTML =

            "🏷️ Point the camera at the SUPPLY QR";

    }

    else {

        message.innerHTML =

            "📷 Point the camera at the PART QR";

    }

}


/*
============================================================
QR SCAN SUCCESS
============================================================
*/

function onScanSuccess(
    decodedText,
    scanner
) {


    const scannedValue =

        String(
            decodedText || ""
        ).trim();


    /*
    ========================================================
    TRY URL
    ========================================================
    */

    let scannedURL = null;


    try {

        scannedURL =

            new URL(
                scannedValue
            );

    }

    catch(error) {

        scannedURL = null;

    }


    /*
    ========================================================
    PRODUCTION
    ========================================================
    */

    if (
        scanType === "production"
    ) {


        if (!scannedURL) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR generated by RRP."

            );

            return;

        }


        const qrPage =

            scannedURL.searchParams.get(
                "page"
            );


        const supplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (
            qrPage !== "production" ||
            !supplyID
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the correct Supply QR."

            );

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                supplyID
            ) +

            "</b><br><br>" +

            "Opening Production Page..."

        );


        stopScanner(
            scanner
        );


        let productionURL =

            appURL +

            "?page=production" +

            "&id=" +

            encodeURIComponent(
                supplyID
            );


        productionURL =

            addSessionToURL(
                productionURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =

                    productionURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    PART
    ========================================================
    */

    if (
        scanType === "part"
    ) {


        showSuccess(

            "✅ Part QR scanned<br><br>" +

            "Part: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Loading Supply Page..."

        );


        stopScanner(
            scanner
        );


        let partURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                scannedValue
            );


        partURL =

            addSessionToURL(
                partURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    partURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    TRAY
    ========================================================
    */

    if (
        scanType === "tray"
    ) {


        if (!existingPart) {

            showError(
                "❌ Part number is missing."
            );

            return;

        }


        showSuccess(

            "✅ Tray QR scanned<br><br>" +

            "Tray: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Returning to Supply Page..."

        );


        stopScanner(
            scanner
        );


        let trayURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                existingPart
            ) +

            "&tray=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +

            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +

            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +

            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +

            encodeURIComponent(
                remarks
            );


        trayURL =

            addSessionToURL(
                trayURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    trayURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BATCH
    ========================================================
    */

    if (
        scanType === "batch"
    ) {


        if (!scannedURL) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR."

            );

            return;

        }


        const batchQRPage =

            scannedURL.searchParams.get(
                "page"
            );


        const batchSupplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (
            batchQRPage !== "production" ||
            !batchSupplyID
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "The QR must contain a valid Supply ID."

            );

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                batchSupplyID
            ) +

            "</b><br><br>" +

            "Opening Batch Create Page..."

        );


        stopScanner(
            scanner
        );


        let batchURL =

            appURL +

            "?page=batchcreate" +

            "&scan=" +

            encodeURIComponent(
                batchSupplyID
            );


        batchURL =

            addSessionToURL(
                batchURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    batchURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    UNKNOWN
    ========================================================
    */

    showError(
        "❌ Unknown scan mode."
    );

}


/*
============================================================
STOP SCANNER
============================================================
*/

function stopScanner(
    scanner
) {

    if (!scanner) {

        return;

    }


    scanner.stop()

        .catch(

            function() {}

        );

}


/*
============================================================
SHOW ERROR
============================================================
*/

function showError(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "error";

}


/*
============================================================
SHOW SUCCESS
============================================================
*/

function showSuccess(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "success";

}


/*
============================================================
SHOW INFO
============================================================
*/

function showInfo(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "info";

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHtml(
    value
) {

    return String(

        value == null
            ? ""
            : value

    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
