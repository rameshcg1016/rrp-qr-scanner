<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
}

</style>

</head>

<body>

<div class="container">

<h2>RRP QR SCANNER</h2>

<div id="reader"></div>

<div id="message">
Starting camera...
</div>

</div>

<script>

const scanner = new Html5Qrcode("reader");


/*
====================================================
READ SCANNER MODE
====================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );

const scanType =
    params.get("type") || "part";

const existingPart =
    params.get("part") || "";


/*
====================================================
SHOW MODE
====================================================
*/

if (scanType === "tray") {

    document.getElementById("message").innerHTML =
        "📦 SCAN TRAY QR";

} else {

    document.getElementById("message").innerHTML =
        "📷 SCAN PART QR";

}


/*
====================================================
QR SUCCESS
====================================================
*/

function onScanSuccess(decodedText) {

    const scannedValue =
        decodedText.trim();


    document.getElementById("message").innerHTML =
        "Scanned: " + scannedValue;


    scanner.stop().then(function() {

        redirect(scannedValue);

    }).catch(function() {

        redirect(scannedValue);

    });

}


/*
====================================================
REDIRECT
====================================================
*/

function redirect(scannedValue) {

    const appURL =
        "https://script.google.com/macros/s/" +
        "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
        "/exec";


    /*
    ================================================
    PART
    ================================================
    */

    if (scanType === "part") {

        const url =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(scannedValue);

        window.location.href = url;

        return;
    }


    /*
    ================================================
    TRAY
    ================================================
    */

    if (scanType === "tray") {

        const url =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(existingPart) +
            "&tray=" +
            encodeURIComponent(scannedValue);


        /*
        IMPORTANT:
        Show the URL so we can verify it
        */

        document.getElementById("message").innerHTML =
            "Returning...<br><br>" +
            url;


        setTimeout(function() {

            window.location.href = url;

        }, 500);

        return;
    }


    document.getElementById("message").innerHTML =
        "❌ Unknown scan type.";

}


/*
====================================================
START CAMERA
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {

    if (!cameras || cameras.length === 0) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;
    }


    const cameraId =
        cameras[0].id;


    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )

    .then(function() {

        if (scanType === "tray") {

            document.getElementById("message").innerHTML =
                "📦 Point camera at TRAY QR";

        } else {

            document.getElementById("message").innerHTML =
                "📷 Point camera at PART QR";

        }

    })

    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error: " + error;

    });

})

.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera: " + error;

});

</script>

</body>

</html>
