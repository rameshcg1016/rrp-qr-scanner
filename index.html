<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
}

</style>

</head>


<body>

<div class="container">

<h2>RRP QR SCANNER</h2>

<div id="reader"></div>

<div id="message">
Starting camera...
</div>

</div>


<script>

/*
====================================================
READ CURRENT URL
====================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );


/*
====================================================
GET SCAN INFORMATION
====================================================
*/

const existingPart =
    params.get("part") || "";

const scanType =
    existingPart.trim() !== ""
        ? "tray"
        : "part";


/*
====================================================
DISPLAY SCAN MODE
====================================================
*/

if (scanType === "tray") {

    document.getElementById("message").innerHTML =
        "📦 POINT CAMERA AT TRAY QR";

} else {

    document.getElementById("message").innerHTML =
        "📷 POINT CAMERA AT PART QR";

}


/*
====================================================
CREATE SCANNER
====================================================
*/

const scanner =
    new Html5Qrcode("reader");


/*
====================================================
QR SCANNED
====================================================
*/

function onScanSuccess(decodedText) {

    const scannedValue =
        decodedText.trim();


    /*
    ================================================
    PART SCAN
    ================================================
    */

    if (scanType === "part") {

        document.getElementById("message").innerHTML =
            "✅ Part QR scanned: " +
            scannedValue +
            "<br><br>Loading...";


        scanner.stop().catch(function() {});


        const partURL =
            "https://script.google.com/macros/s/" +
            "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
            "/exec?page=supply" +
            "&part=" +
            encodeURIComponent(scannedValue);


        setTimeout(function() {

            window.location.href =
                partURL;

        }, 500);


        return;
    }


    /*
    ================================================
    TRAY SCAN
    ================================================
    */

    if (scanType === "tray") {


        /*
        Make sure existing part exists
        */

        if (!existingPart) {

            document.getElementById("message").innerHTML =
                "❌ Existing Part Number is missing.";

            return;

        }


        /*
        Stop camera
        */

        scanner.stop().catch(function() {});


        /*
        Build FINAL URL
        */

        const trayURL =
            "https://script.google.com/macros/s/" +
            "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
            "/exec?page=supply" +
            "&part=" +
            encodeURIComponent(existingPart) +
            "&tray=" +
            encodeURIComponent(scannedValue);


        /*
        SHOW URL FOR TESTING
        */

        document.getElementById("message").innerHTML =
            "✅ TRAY QR SCANNED" +
            "<br><br>" +
            "Tray: <b>" +
            scannedValue +
            "</b>" +
            "<br><br>" +
            "Returning to Supply Page...";


        /*
        REDIRECT
        */

        setTimeout(function() {

            window.location.href =
                trayURL;

        }, 700);


        return;

    }


    /*
    ================================================
    UNKNOWN
    ================================================
    */

    document.getElementById("message").innerHTML =
        "❌ Unknown scan type.";

}


/*
====================================================
START CAMERA
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {


    if (!cameras || cameras.length === 0) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    Use first available camera
    */

    const cameraId =
        cameras[0].id;


    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )


    .then(function() {

        if (scanType === "tray") {

            document.getElementById("message").innerHTML =
                "📦 POINT CAMERA AT TRAY QR";

        } else {

            document.getElementById("message").innerHTML =
                "📷 POINT CAMERA AT PART QR";

        }

    })


    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error: " +
            error;

    });

})


.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera: " +
        error;

});

</script>

</body>

</html>
