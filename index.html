<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    margin: 0;

    padding: 20px;

    background: #f2f2f2;

}


.container {

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 12px;

}


h2 {

    text-align: center;

    margin-top: 5px;

}


#reader {

    width: 100%;

    margin-top: 20px;

}


#message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

    word-break: break-word;

    line-height: 1.5;

}


.error {

    color: #c62828;

}


.success {

    color: #2e7d32;

}


.info {

    color: #555;

}


.gateway-button {

    display: inline-block;

    margin-top: 15px;

    padding: 13px 22px;

    background: #1976d2;

    color: white;

    text-decoration: none;

    border-radius: 8px;

    font-weight: bold;

}

</style>

</head>


<body>


<div class="container">

    <h2>
        RRP QR SCANNER
    </h2>


    <div id="reader"></div>


    <div id="message"
         class="info">

        Starting...

    </div>

</div>


<script>


/*
============================================================
RRP APPS SCRIPT URL
============================================================
*/

const APP_URL =

    "https://script.google.com/macros/s/" +

    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +

    "/exec";


/*
============================================================
GITHUB GATEWAY URL
============================================================
*/

const GATEWAY_URL =

    "https://rameshcg1016.github.io/rrp-qr-scanner/";


/*
============================================================
CURRENT URL
============================================================
*/

const currentURL =

    new URL(
        window.location.href
    );


const params =

    currentURL.searchParams;


/*
============================================================
GATEWAY MODE
============================================================
*/

const gatewayMode =

    params.get("mode") || "";


/*
============================================================
TARGET
============================================================
*/

const encodedTarget =

    params.get("target") || "";


/*
============================================================
GATEWAY SESSION
============================================================
*/

const gatewaySession =

    params.get("session") || "";


/*
============================================================
NORMAL SCANNER PARAMETERS
============================================================
*/

const scanType =

    params.get("type") || "part";


const existingPart =

    params.get("part") || "";


const supplyDate =

    params.get("supplyDate") || "";


const suppliedKg =

    params.get("suppliedKg") || "";


const targetQty =

    params.get("targetQty") || "";


const remarks =

    params.get("remarks") || "";


/*
============================================================
SESSION TOKEN
============================================================
*/

let sessionToken =

    params.get("session") || "";


/*
============================================================
READ SESSION FROM LOCAL STORAGE
============================================================
*/

function readLocalSession() {

    try {

        return (

            localStorage.getItem(
                "rrpSession"
            ) || ""

        );

    }

    catch(error) {

        return "";

    }

}


/*
============================================================
READ SESSION FROM COOKIE
============================================================
*/

function readCookieSession() {

    try {

        const cookies =

            document.cookie
                .split(";");


        for (
            let i = 0;
            i < cookies.length;
            i++
        ) {

            const cookie =

                cookies[i].trim();


            if (
                cookie.indexOf(
                    "rrpSession="
                ) === 0
            ) {

                return decodeURIComponent(

                    cookie.substring(
                        "rrpSession=".length
                    )

                );

            }

        }

    }

    catch(error) {

        return "";

    }


    return "";

}


/*
============================================================
GET SAVED SESSION
============================================================
*/

if (!sessionToken) {

    sessionToken =
        readLocalSession();

}


if (!sessionToken) {

    sessionToken =
        readCookieSession();

}


/*
============================================================
SAVE SESSION
============================================================
*/

function saveSession(
    token
) {

    if (!token) {

        return;

    }


    /*
    --------------------------------------------------------
    LOCAL STORAGE
    --------------------------------------------------------
    */

    try {

        localStorage.setItem(
            "rrpSession",
            token
        );

    }

    catch(error) {

        console.log(
            "Local storage unavailable."
        );

    }


    /*
    --------------------------------------------------------
    COOKIE
    --------------------------------------------------------
    */

    try {

        document.cookie =

            "rrpSession=" +

            encodeURIComponent(
                token
            ) +

            "; path=/" +

            "; max-age=21600" +

            "; SameSite=Lax";

    }

    catch(error) {

        console.log(
            "Cookie storage unavailable."
        );

    }

}


/*
============================================================
GET TARGET FROM BASE64
============================================================
*/

function getTargetURL() {

    if (!encodedTarget) {

        return "";

    }


    try {

        return atob(
            encodedTarget
        );

    }

    catch(error) {

        try {

            return atob(
                decodeURIComponent(
                    encodedTarget
                )
            );

        }

        catch(error2) {

            return "";

        }

    }

}


/*
============================================================
CREATE FINAL APPS SCRIPT URL
============================================================
*/

function createFinalAppURL(
    targetURL,
    token
) {

    if (!targetURL) {

        return "";

    }


    try {

        const sourceURL =

            new URL(
                targetURL
            );


        const finalURL =

            new URL(
                APP_URL
            );


        /*
        ----------------------------------------------------
        COPY ORIGINAL PARAMETERS
        ----------------------------------------------------
        */

        sourceURL.searchParams.forEach(

            function(
                value,
                key
            ) {

                if (

                    key === "session" ||

                    key === "rrpGateway" ||

                    key === "gatewayReturn"

                ) {

                    return;

                }


                finalURL.searchParams.set(
                    key,
                    value
                );

            }

        );


        /*
        ----------------------------------------------------
        ADD SESSION
        ----------------------------------------------------
        */

        if (token) {

            finalURL.searchParams.set(
                "session",
                token
            );

        }


        return finalURL.toString();

    }

    catch(error) {

        return "";

    }

}


/*
============================================================
CREATE LOGIN URL
============================================================
*/

function createLoginURL(
    targetURL
) {

    try {

        const url =

            new URL(
                targetURL
            );


        /*
        ----------------------------------------------------
        GATEWAY FLAG
        ----------------------------------------------------
        */

        url.searchParams.set(
            "rrpGateway",
            "1"
        );


        /*
        ----------------------------------------------------
        RETURN TO GITHUB
        ----------------------------------------------------
        */

        url.searchParams.set(
            "gatewayReturn",
            GATEWAY_URL
        );


        return url.toString();

    }

    catch(error) {

        return "";

    }

}


/*
============================================================
GATEWAY ENTRY
============================================================
*/

function openGatewayTarget() {


    const targetURL =

        getTargetURL();


    /*
    --------------------------------------------------------
    TARGET REQUIRED
    --------------------------------------------------------
    */

    if (!targetURL) {

        showError(
            "❌ Gateway target URL is missing."
        );

        return;

    }


    /*
    ========================================================
    SAVED SESSION
    ========================================================
    */

    if (sessionToken) {


        const finalURL =

            createFinalAppURL(
                targetURL,
                sessionToken
            );


        if (!finalURL) {

            showError(
                "❌ Unable to create ERP URL."
            );

            return;

        }


        showSuccess(

            "Opening RRP ERP..."

        );


        setTimeout(

            function() {

                window.location.href =
                    finalURL;

            },

            300

        );


        return;

    }


    /*
    ========================================================
    NO SESSION
    ========================================================
    */

    const loginURL =

        createLoginURL(
            targetURL
        );


    if (!loginURL) {

        showError(
            "❌ Unable to create Login URL."
        );

        return;

    }


    showInfo(
        "Opening RRP Login..."
    );


    setTimeout(

        function() {

            window.location.href =
                loginURL;

        },

        300

    );

}


/*
============================================================
GATEWAY LOGIN CALLBACK
============================================================

Expected:

?mode=gateway-login
&session=XXXXX
&target=BASE64

============================================================
*/

function handleGatewayLogin() {


    /*
    --------------------------------------------------------
    SESSION REQUIRED
    --------------------------------------------------------
    */

    if (!gatewaySession) {

        showError(
            "❌ Login session was not received."
        );

        return;

    }


    /*
    --------------------------------------------------------
    SAVE SESSION
    --------------------------------------------------------
    */

    saveSession(
        gatewaySession
    );


    sessionToken =
        gatewaySession;


    /*
    --------------------------------------------------------
    TARGET
    --------------------------------------------------------
    */

    const targetURL =

        getTargetURL();


    if (!targetURL) {

        showError(
            "❌ Gateway target is missing."
        );

        return;

    }


    /*
    --------------------------------------------------------
    FINAL ERP URL
    --------------------------------------------------------
    */

    const finalURL =

        createFinalAppURL(
            targetURL,
            gatewaySession
        );


    if (!finalURL) {

        showError(
            "❌ Unable to create final ERP URL."
        );

        return;

    }


    /*
    --------------------------------------------------------
    SUCCESS
    --------------------------------------------------------
    */

    showSuccess(

        "✅ Login successful.<br><br>" +

        "Opening RRP ERP..."

    );


    /*
    --------------------------------------------------------
    FALLBACK BUTTON
    --------------------------------------------------------
    */

    const message =

        document.getElementById(
            "message"
        );


    const link =

        document.createElement(
            "a"
        );


    link.href =
        finalURL;


    link.target =
        "_top";


    link.className =
        "gateway-button";


    link.textContent =
        "OPEN RRP ERP";


    message.appendChild(
        document.createElement("br")
    );


    message.appendChild(
        link
    );


    /*
    --------------------------------------------------------
    AUTOMATIC REDIRECT
    --------------------------------------------------------
    */

    setTimeout(

        function() {

            window.location.href =
                finalURL;

        },

        500

    );

}


/*
============================================================
GATEWAY MUST RUN BEFORE CAMERA
============================================================
*/

if (
    gatewayMode === "gateway"
) {

    openGatewayTarget();

}


else if (
    gatewayMode === "gateway-login"
) {

    handleGatewayLogin();

}


else {

    startNormalScanner();

}


/*
============================================================
NORMAL SCANNER
============================================================
*/

function startNormalScanner() {


    showScanMessage();


    const scanner =

        new Html5Qrcode(
            "reader"
        );


    let scanLocked = false;


    Html5Qrcode.getCameras()

        .then(

            function(cameras) {


                if (
                    !cameras ||
                    cameras.length === 0
                ) {

                    showError(
                        "❌ No camera found."
                    );

                    return;

                }


                const cameraId =

                    cameras[0].id;


                scanner.start(

                    cameraId,

                    {

                        fps: 10,

                        qrbox: {

                            width: 250,

                            height: 250

                        }

                    },

                    function(decodedText) {


                        if (
                            scanLocked
                        ) {

                            return;

                        }


                        scanLocked = true;


                        onScanSuccess(

                            decodedText,

                            scanner

                        );

                    }

                )

                .then(

                    function() {

                        showScanMessage();

                    }

                )

                .catch(

                    function(error) {

                        showError(

                            "❌ Camera error:<br>" +

                            escapeHtml(
                                error
                            )

                        );

                    }

                );

            }

        )

        .catch(

            function(error) {

                showError(

                    "❌ Unable to access camera:<br>" +

                    escapeHtml(
                        error
                    )

                );

            }

        );

}


/*
============================================================
SHOW SCAN MODE
============================================================
*/

function showScanMessage() {


    const message =

        document.getElementById(
            "message"
        );


    if (
        scanType === "tray"
    ) {

        message.innerHTML =
            "📦 Point the camera at the TRAY QR";

    }

    else if (
        scanType === "production"
    ) {

        message.innerHTML =
            "🏭 Point the camera at the SUPPLY QR";

    }

    else if (
        scanType === "batch"
    ) {

        message.innerHTML =
            "🏷️ Point the camera at the SUPPLY QR";

    }

    else {

        message.innerHTML =
            "📷 Point the camera at the PART QR";

    }

}


/*
============================================================
QR SCAN SUCCESS
============================================================
*/

function onScanSuccess(
    decodedText,
    scanner
) {


    const scannedValue =

        String(
            decodedText || ""
        ).trim();


    /*
    ========================================================
    TRY URL
    ========================================================
    */

    let scannedURL = null;


    try {

        scannedURL =

            new URL(
                scannedValue
            );

    }

    catch(error) {

        scannedURL = null;

    }


    /*
    ========================================================
    PRODUCTION
    ========================================================
    */

    if (
        scanType === "production"
    ) {


        if (!scannedURL) {

            showError(
                "❌ Invalid Supply QR."
            );

            return;

        }


        const qrPage =

            scannedURL.searchParams.get(
                "page"
            );


        const supplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (
            qrPage !== "production" ||
            !supplyID
        ) {

            showError(
                "❌ Invalid Supply QR."
            );

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                supplyID
            ) +

            "</b><br><br>" +

            "Opening Production Page..."

        );


        stopScanner(
            scanner
        );


        let productionURL =

            APP_URL +

            "?page=production" +

            "&id=" +

            encodeURIComponent(
                supplyID
            );


        productionURL =

            addSessionToURL(
                productionURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    productionURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    PART
    ========================================================
    */

    if (
        scanType === "part"
    ) {


        showSuccess(

            "✅ Part QR scanned<br><br>" +

            "Part: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Loading Supply Page..."

        );


        stopScanner(
            scanner
        );


        let partURL =

            APP_URL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                scannedValue
            );


        partURL =

            addSessionToURL(
                partURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    partURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    TRAY
    ========================================================
    */

    if (
        scanType === "tray"
    ) {


        if (!existingPart) {

            showError(
                "❌ Part number is missing."
            );

            return;

        }


        showSuccess(

            "✅ Tray QR scanned<br><br>" +

            "Tray: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Returning to Supply Page..."

        );


        stopScanner(
            scanner
        );


        let trayURL =

            APP_URL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                existingPart
            ) +

            "&tray=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +

            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +

            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +

            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +

            encodeURIComponent(
                remarks
            );


        trayURL =

            addSessionToURL(
                trayURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    trayURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BATCH
    ========================================================
    */

    if (
        scanType === "batch"
    ) {


        if (!scannedURL) {

            showError(
                "❌ Invalid Supply QR."
            );

            return;

        }


        const batchQRPage =

            scannedURL.searchParams.get(
                "page"
            );


        const batchSupplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (
            batchQRPage !== "production" ||
            !batchSupplyID
        ) {

            showError(
                "❌ Invalid Supply QR."
            );

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                batchSupplyID
            ) +

            "</b><br><br>" +

            "Opening Batch Create Page..."

        );


        stopScanner(
            scanner
        );


        let batchURL =

            APP_URL +

            "?page=batchcreate" +

            "&scan=" +

            encodeURIComponent(
                batchSupplyID
            );


        batchURL =

            addSessionToURL(
                batchURL,
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    batchURL;

            },

            500

        );


        return;

    }


    showError(
        "❌ Unknown scan mode."
    );

}


/*
============================================================
ADD SESSION TO NORMAL SCANNER URL
============================================================
*/

function addSessionToURL(
    targetURL,
    token
) {

    if (!targetURL) {

        return "";

    }


    try {

        const url =

            new URL(
                targetURL
            );


        url.searchParams.delete(
            "session"
        );


        if (token) {

            url.searchParams.set(
                "session",
                token
            );

        }


        return url.toString();

    }

    catch(error) {

        return targetURL;

    }

}


/*
============================================================
STOP SCANNER
============================================================
*/

function stopScanner(
    scanner
) {

    if (!scanner) {

        return;

    }


    scanner.stop()

        .catch(
            function() {}
        );

}


/*
============================================================
SHOW ERROR
============================================================
*/

function showError(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "error";

}


/*
============================================================
SHOW SUCCESS
============================================================
*/

function showSuccess(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "success";

}


/*
============================================================
SHOW INFO
============================================================
*/

function showInfo(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "info";

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHtml(
    value
) {

    return String(

        value == null
            ? ""
            : value

    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
