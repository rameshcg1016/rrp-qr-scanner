<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://accounts.google.com/gsi/client"
        async
        defer>
</script>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
    box-sizing: border-box;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    margin: 0;

    padding: 20px;

    background: #f2f2f2;

}

.container {

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 12px;

}

h2 {

    text-align: center;

    margin-top: 5px;

}

#loginSection {

    text-align: center;

    padding: 15px 0 20px 0;

}

#loginTitle {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 15px;

}

#googleButton {

    display: flex;

    justify-content: center;

}

#loginMessage {

    margin-top: 15px;

    font-size: 14px;

    line-height: 1.5;

}

#userInfo {

    display: none;

    background: #eef6ff;

    border-radius: 8px;

    padding: 10px;

    margin-bottom: 15px;

    font-size: 14px;

    text-align: center;

}

#userName {

    font-weight: bold;

    margin-bottom: 4px;

}

#userEmail {

    margin-bottom: 4px;

}

#userRoles {

    font-size: 13px;

    color: #555;

}

#reader {

    width: 100%;

    margin-top: 20px;

}

#scannerSection {

    display: none;

}

#message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

    word-break: break-word;

    line-height: 1.5;

}

.error {

    color: #c62828;

}

.success {

    color: #2e7d32;

}

.info {

    color: #555;

}

.logout {

    margin-top: 10px;

    padding: 8px 15px;

    border: none;

    border-radius: 6px;

    background: #777;

    color: white;

    cursor: pointer;

}

</style>

</head>


<body>


<div class="container">


<h2>
RRP QR SCANNER
</h2>


<!-- =====================================================
     LOGIN
     ===================================================== -->

<div id="loginSection">

    <div id="loginTitle">
        Sign in to RRP ERP
    </div>

    <div id="googleButton">
        Loading Google Login...
    </div>

    <div id="loginMessage"
         class="info">

        Please sign in with your authorized
        Google account.

    </div>

</div>


<!-- =====================================================
     USER INFORMATION
     ===================================================== -->

<div id="userInfo">

    <div id="userName"></div>

    <div id="userEmail"></div>

    <div id="userRoles"></div>

    <button
        class="logout"
        onclick="logoutUser()">

        Sign Out

    </button>

</div>


<!-- =====================================================
     SCANNER
     ===================================================== -->

<div id="scannerSection">

    <div id="reader"></div>

    <div id="message">
        Starting camera...
    </div>

</div>


</div>


<script>


/*
============================================================
CONFIGURATION
============================================================
*/

const GOOGLE_CLIENT_ID =

    "645915267179-jg8ajdaq408hgok69t4v3on4iv2ktlo4.apps.googleusercontent.com";


const appURL =

    "https://script.google.com/macros/s/" +

    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +

    "/exec";


const scannerURL =

    "https://rameshcg1016.github.io/rrp-qr-scanner/";


/*
============================================================
READ CURRENT URL
============================================================
*/

const currentURL =

    new URL(
        window.location.href
    );

const params =

    currentURL.searchParams;


/*
============================================================
SCAN PARAMETERS
============================================================
*/

const scanType =

    params.get("type") || "part";


const existingPart =

    params.get("part") || "";


const supplyDate =

    params.get("supplyDate") || "";


const suppliedKg =

    params.get("suppliedKg") || "";


const targetQty =

    params.get("targetQty") || "";


const remarks =

    params.get("remarks") || "";


/*
============================================================
SESSION
============================================================
*/

let sessionToken =

    params.get("session") || "";


if (!sessionToken) {

    sessionToken =

        localStorage.getItem(
            "rrpSession"
        ) || "";

}


if (sessionToken) {

    localStorage.setItem(
        "rrpSession",
        sessionToken
    );

}


/*
============================================================
SCANNER VARIABLES
============================================================
*/

let scanner = null;

let scanLocked = false;


/*
============================================================
CURRENT USER
============================================================
*/

let currentUser = null;


/*
============================================================
PAGE LOAD
============================================================
*/

window.addEventListener(

    "load",

    function() {

        initializeGoogleLogin();

    }

);


/*
============================================================
GOOGLE LOGIN
============================================================
*/

function initializeGoogleLogin() {


    if (

        typeof google === "undefined" ||

        !google.accounts ||

        !google.accounts.id

    ) {

        setTimeout(

            initializeGoogleLogin,

            500

        );

        return;

    }


    /*
    --------------------------------------------------------
    GOOGLE INITIALIZE
    --------------------------------------------------------
    */

    google.accounts.id.initialize({

        client_id:
            GOOGLE_CLIENT_ID,

        callback:
            handleGoogleLogin

    });


    /*
    --------------------------------------------------------
    GOOGLE BUTTON
    --------------------------------------------------------
    */

    google.accounts.id.renderButton(

        document.getElementById(
            "googleButton"
        ),

        {

            theme:
                "outline",

            size:
                "large",

            text:
                "signin_with",

            shape:
                "rectangular",

            width:
                300

        }

    );


}


/*
============================================================
GOOGLE LOGIN SUCCESS
============================================================
*/

function handleGoogleLogin(
    response
) {


    if (
        !response ||
        !response.credential
    ) {

        showLoginError(
            "Google login failed."
        );

        return;

    }


    document.getElementById(
        "loginMessage"
    ).innerHTML =

        "Checking your RRP account...";


    document.getElementById(
        "loginMessage"
    ).className =
        "info";


    submitAuthentication(

        response.credential

    );

}


/*
============================================================
SEND GOOGLE TOKEN TO APPS SCRIPT
============================================================
*/

function submitAuthentication(
    googleToken
) {


    /*
    --------------------------------------------------------
    DETERMINE REQUESTED PAGE
    --------------------------------------------------------
    */

    const requestedPage =

        getRequestedPage();


    /*
    --------------------------------------------------------
    CREATE POST FORM
    --------------------------------------------------------
    */

    const form =

        document.createElement(
            "form"
        );


    form.method =
        "POST";


    form.action =
        appURL;


    /*
    --------------------------------------------------------
    GOOGLE TOKEN
    --------------------------------------------------------
    */

    const tokenInput =

        document.createElement(
            "input"
        );


    tokenInput.type =
        "hidden";


    tokenInput.name =
        "googleToken";


    tokenInput.value =
        googleToken;


    form.appendChild(
        tokenInput
    );


    /*
    --------------------------------------------------------
    PAGE
    --------------------------------------------------------
    */

    const pageInput =

        document.createElement(
            "input"
        );


    pageInput.type =
        "hidden";


    pageInput.name =
        "page";


    pageInput.value =
        requestedPage;


    form.appendChild(
        pageInput
    );


    /*
    --------------------------------------------------------
    SCAN TYPE
    --------------------------------------------------------
    */

    const typeInput =

        document.createElement(
            "input"
        );


    typeInput.type =
        "hidden";


    typeInput.name =
        "scanType";


    typeInput.value =
        scanType;


    form.appendChild(
        typeInput
    );


    /*
    --------------------------------------------------------
    SUBMIT
    --------------------------------------------------------
    */

    document.body.appendChild(
        form
    );


    form.submit();

}


/*
============================================================
REQUESTED PAGE
============================================================
*/

function getRequestedPage() {


    /*
    --------------------------------------------------------
    PRODUCTION SCANNER
    --------------------------------------------------------
    */

    if (
        scanType === "production"
    ) {

        return "production";

    }


    /*
    --------------------------------------------------------
    BATCH SCANNER
    --------------------------------------------------------
    */

    if (
        scanType === "batch"
    ) {

        return "batchcreate";

    }


    /*
    --------------------------------------------------------
    DEFAULT
    --------------------------------------------------------
    */

    return "supply";

}


/*
============================================================
LOGIN ERROR
============================================================
*/

function showLoginError(
    message
) {

    const element =

        document.getElementById(
            "loginMessage"
        );


    element.innerHTML =

        "❌ " +

        escapeHtml(
            message
        );


    element.className =
        "error";

}


/*
============================================================
LOGOUT
============================================================
*/

function logoutUser() {


    stopScanner();


    localStorage.removeItem(
        "rrpSession"
    );


    localStorage.removeItem(
        "rrpUser"
    );


    sessionToken = "";

    currentUser = null;


    window.location.href =
        scannerURL;

}


/*
============================================================
START SCANNER
============================================================
*/

function startScanner() {


    document.getElementById(
        "loginSection"
    ).style.display =
        "none";


    document.getElementById(
        "scannerSection"
    ).style.display =
        "block";


    /*
    --------------------------------------------------------
    USER INFO
    --------------------------------------------------------
    */

    if (
        currentUser
    ) {

        document.getElementById(
            "userInfo"
        ).style.display =
            "block";


        document.getElementById(
            "userName"
        ).innerHTML =

            "👤 " +

            escapeHtml(
                currentUser.name
            );


        document.getElementById(
            "userEmail"
        ).innerHTML =

            escapeHtml(
                currentUser.email
            );


        document.getElementById(
            "userRoles"
        ).innerHTML =

            "Roles: " +

            escapeHtml(
                currentUser.roles.join(
                    ", "
                )
            );

    }


    /*
    --------------------------------------------------------
    MESSAGE
    --------------------------------------------------------
    */

    showScanMessage();


    /*
    --------------------------------------------------------
    CREATE SCANNER
    --------------------------------------------------------
    */

    scanner =

        new Html5Qrcode(
            "reader"
        );


    /*
    --------------------------------------------------------
    GET CAMERA
    --------------------------------------------------------
    */

    Html5Qrcode.getCameras()

    .then(

        function(cameras) {


            if (

                !cameras ||

                cameras.length === 0

            ) {

                document.getElementById(
                    "message"
                ).innerHTML =

                    "❌ No camera found.";

                return;

            }


            /*
            ----------------------------------------------
            FIRST CAMERA
            ----------------------------------------------
            */

            const cameraId =
                cameras[0].id;


            /*
            ----------------------------------------------
            START
            ----------------------------------------------
            */

            scanner.start(

                cameraId,

                {

                    fps: 10,

                    qrbox: {

                        width: 250,

                        height: 250

                    }

                },

                onScanSuccess

            )

            .then(

                function() {

                    showScanMessage();

                }

            )

            .catch(

                function(error) {

                    document.getElementById(
                        "message"
                    ).innerHTML =

                        "❌ Camera error:<br>" +

                        escapeHtml(
                            error
                        );

                }

            );

        }

    )

    .catch(

        function(error) {

            document.getElementById(
                "message"
            ).innerHTML =

                "❌ Unable to access camera:<br>" +

                escapeHtml(
                    error
                );

        }

    );

}


/*
============================================================
SCAN MESSAGE
============================================================
*/

function showScanMessage() {


    const message =

        document.getElementById(
            "message"
        );


    if (
        scanType === "tray"
    ) {

        message.innerHTML =

            "📦 Point the camera at the TRAY QR";

    }

    else if (
        scanType === "batch"
    ) {

        message.innerHTML =

            "🏷️ Point the camera at the SUPPLY QR";

    }

    else if (
        scanType === "production"
    ) {

        message.innerHTML =

            "🏭 Point the camera at the SUPPLY QR";

    }

    else {

        message.innerHTML =

            "📷 Point the camera at the PART QR";

    }

}


/*
============================================================
QR SCAN SUCCESS
============================================================
*/

function onScanSuccess(
    decodedText
) {


    if (
        scanLocked
    ) {

        return;

    }


    scanLocked = true;


    const scannedValue =

        decodedText.trim();


    /*
    ========================================================
    IMPORTANT:
    DETECT APPS SCRIPT SUPPLY URL
    ========================================================
    */

    let scannedURL = null;


    try {

        scannedURL =
            new URL(
                scannedValue
            );

    }

    catch(error) {

        scannedURL = null;

    }


    /*
    ========================================================
    IF QR IS A URL
    ========================================================
    */

    if (
        scannedURL
    ) {


        /*
        ----------------------------------------------------
        GET PAGE PARAMETER
        ----------------------------------------------------
        */

        const qrPage =

            scannedURL.searchParams.get(
                "page"
            );


        /*
        ----------------------------------------------------
        GET SUPPLY ID
        ----------------------------------------------------
        */

        const supplyID =

            scannedURL.searchParams.get(
                "id"
            );


        /*
        ====================================================
        PRODUCTION QR
        ====================================================
        */

        if (
            qrPage === "production" &&
            supplyID
        ) {


            document.getElementById(
                "message"
            ).innerHTML =

                "✅ SUPPLY QR SCANNED<br><br>" +

                "Supply ID: <b>" +

                escapeHtml(
                    supplyID
                ) +

                "</b><br><br>" +

                "Opening Production Page...";


            stopScanner();


            const productionURL =

                appURL +

                "?page=production" +

                "&id=" +

                encodeURIComponent(
                    supplyID
                ) +

                "&session=" +

                encodeURIComponent(
                    sessionToken
                );


            setTimeout(

                function() {

                    window.location.href =
                        productionURL;

                },

                500

            );


            return;

        }


        /*
        ====================================================
        BATCH QR
        ====================================================
        */

        if (
            qrPage === "production" &&
            supplyID
        ) {


            /*
            This branch is normally handled by the
            scanType === "batch" section below.

            It is intentionally left here as a fallback.
            */

        }

    }


    /*
    ========================================================
    PRODUCTION SCAN MODE
    ========================================================
    */

    if (
        scanType === "production"
    ) {


        /*
        ----------------------------------------------------
        IF QR WAS NOT THE EXPECTED URL
        ----------------------------------------------------
        */

        document.getElementById(
            "message"
        ).innerHTML =

            "❌ Invalid Supply QR.<br><br>" +

            "Please scan the Supply QR generated by RRP.";

        scanLocked = false;

        return;

    }


    /*
    ========================================================
    PART QR
    ========================================================
    */

    if (
        scanType === "part"
    ) {


        document.getElementById(
            "message"
        ).innerHTML =

            "✅ Part QR scanned<br><br>" +

            "Part: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Loading Supply Page...";


        stopScanner();


        const partURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    partURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    TRAY QR
    ========================================================
    */

    if (
        scanType === "tray"
    ) {


        if (
            !existingPart
        ) {


            document.getElementById(
                "message"
            ).innerHTML =

                "❌ Part number is missing.";


            scanLocked = false;


            return;

        }


        document.getElementById(
            "message"
        ).innerHTML =

            "✅ Tray QR scanned<br><br>" +

            "Tray: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Returning to Supply Page...";


        stopScanner();


        const trayURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                existingPart
            ) +

            "&tray=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +

            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +

            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +

            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +

            encodeURIComponent(
                remarks
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    trayURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BATCH / SUPPLY QR
    ========================================================
    */

    if (
        scanType === "batch"
    ) {


        /*
        ----------------------------------------------------
        QR MUST BE SUPPLY PRODUCTION URL
        ----------------------------------------------------
        */

        if (
            !scannedURL
        ) {

            document.getElementById(
                "message"
            ).innerHTML =

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR.";

            scanLocked = false;

            return;

        }


        const batchQRPage =

            scannedURL.searchParams.get(
                "page"
            );


        const batchSupplyID =

            scannedURL.searchParams.get(
                "id"
            );


        /*
        ----------------------------------------------------
        CHECK SUPPLY QR
        ----------------------------------------------------
        */

        if (
            batchQRPage !== "production" ||
            !batchSupplyID
        ) {


            document.getElementById(
                "message"
            ).innerHTML =

                "❌ Invalid Supply QR.<br><br>" +

                "The QR must contain a valid Supply ID.";

            scanLocked = false;

            return;

        }


        document.getElementById(
            "message"
        ).innerHTML =

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                batchSupplyID
            ) +

            "</b><br><br>" +

            "Opening Batch Create Page...";


        stopScanner();


        /*
        ----------------------------------------------------
        OPEN BATCH CREATE
        ----------------------------------------------------
        */

        const batchURL =

            appURL +

            "?page=batchcreate" +

            "&scan=" +

            encodeURIComponent(
                batchSupplyID
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    batchURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    UNKNOWN
    ========================================================
    */

    document.getElementById(
        "message"
    ).innerHTML =

        "❌ Unknown scan mode.";


    scanLocked = false;

}


/*
============================================================
STOP SCANNER
============================================================
*/

function stopScanner() {


    if (
        scanner
    ) {

        scanner.stop()

        .catch(
            function() {}
        );

    }

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHtml(
    value
) {

    return String(

        value == null
            ? ""
            : value

    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


</script>


</body>

</html>
