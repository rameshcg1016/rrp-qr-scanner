<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
}

</style>

</head>


<body>

<div class="container">

<h2>RRP QR SCANNER</h2>

<div id="reader"></div>

<div class="message" id="message">
Starting camera...
</div>

</div>


<script>

/*
====================================================
CREATE QR SCANNER
====================================================
*/

const scanner = new Html5Qrcode("reader");


/*
====================================================
WHEN QR IS SCANNED
====================================================
*/

function onScanSuccess(decodedText) {

    var scannedValue = decodedText.trim();


    document.getElementById("message").innerHTML =
        "Scanned: " + scannedValue;


    /*
    Stop camera before leaving page
    */

    scanner.stop().then(function() {

        redirectAfterScan(scannedValue);

    }).catch(function() {

        /*
        Even if stopping the camera fails,
        continue with the redirect.
        */

        redirectAfterScan(scannedValue);

    });

}


/*
====================================================
DECIDE WHERE TO RETURN AFTER SCAN
====================================================
*/

function redirectAfterScan(scannedValue) {


    /*
    Get parameters from scanner URL
    */

    var params =
        new URLSearchParams(
            window.location.search
        );


    /*
    type = part OR tray
    */

    var scanType =
        params.get("type") || "part";


    /*
    YOUR APPS SCRIPT WEB APP
    */

    var appURL =
        "https://script.google.com/macros/s/AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA/exec";


    /*
    ================================================
    PART QR SCAN
    ================================================
    */

    if (scanType === "part") {

        window.location.href =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(scannedValue);

        return;

    }


    /*
    ================================================
    TRAY QR SCAN
    ================================================
    */

    if (scanType === "tray") {


        /*
        Get the Part Number that was already scanned
        */

        var part =
            params.get("part") || "";


        /*
        Return both values to Supply Page
        */

        window.location.href =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(part) +
            "&tray=" +
            encodeURIComponent(scannedValue);

        return;

    }


    /*
    ================================================
    UNKNOWN SCAN TYPE
    ================================================
    */

    document.getElementById("message").innerHTML =
        "❌ Unknown scanner type.";

}


/*
====================================================
GET AVAILABLE CAMERAS
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {


    if (!cameras || cameras.length === 0) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    Use first available camera.

    We do NOT force "environment" or
    "user", so this works with:

    - Laptop webcam
    - Android
    - iPhone
    */

    var cameraId =
        cameras[0].id;


    /*
    START CAMERA
    */

    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )


    .then(function() {

        /*
        Display appropriate instruction
        */

        var params =
            new URLSearchParams(
                window.location.search
            );


        var scanType =
            params.get("type") || "part";


        if (scanType === "tray") {

            document.getElementById("message").innerHTML =
                "📦 Point the camera at the Tray QR";

        } else {

            document.getElementById("message").innerHTML =
                "📷 Point the camera at the Part QR";

        }

    })


    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error: " + error;

    });

})


.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera: " + error;

});

</script>

</body>

</html>
