<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    margin: 0;

    padding: 20px;

    background: #f2f2f2;

}


.container {

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 12px;

}


h2 {

    text-align: center;

    margin-top: 5px;

}


#reader {

    width: 100%;

    margin-top: 20px;

}


#message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

    word-break: break-word;

    line-height: 1.5;

}


.error {

    color: #c62828;

}


.success {

    color: #2e7d32;

}


.info {

    color: #555;

}

</style>

</head>


<body>


<div class="container">


<h2>
    RRP QR SCANNER
</h2>


<div id="reader"></div>


<div
    id="message"
    class="info"
>

    Starting camera...

</div>


</div>


<script>


/*
============================================================
RRP APPS SCRIPT URL
============================================================
*/

const appURL =

    "https://script.google.com/macros/s/" +

    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +

    "/exec";


/*
============================================================
GITHUB SCANNER URL
============================================================
*/

const scannerURL =

    "https://rameshcg1016.github.io/rrp-qr-scanner/";


/*
============================================================
READ CURRENT URL
============================================================
*/

const currentURL =

    new URL(
        window.location.href
    );


const params =

    currentURL.searchParams;


/*
============================================================
SCAN TYPE
============================================================

SUPPORTED MODES:

part
partbasic
blankcutting
tray
production
batch

============================================================
*/

const scanType =

    params.get("type") || "part";


/*
============================================================
EXISTING PART
============================================================
*/

const existingPart =

    params.get("part") || "";


/*
============================================================
SUPPLY DATA
============================================================
*/

const supplyDate =

    params.get("supplyDate") || "";


const suppliedKg =

    params.get("suppliedKg") || "";


const targetQty =

    params.get("targetQty") || "";


const remarks =

    params.get("remarks") || "";


/*
============================================================
SESSION TOKEN
============================================================
*/

let sessionToken =

    params.get("session") || "";


/*
============================================================
IF SESSION NOT IN URL
TRY LOCAL STORAGE
============================================================
*/

if (!sessionToken) {

    try {

        sessionToken =

            localStorage.getItem(
                "rrpSession"
            ) || "";

    }

    catch(error) {

        console.log(
            "Unable to read saved session."
        );

        sessionToken = "";

    }

}


/*
============================================================
SAVE SESSION
============================================================
*/

if (sessionToken) {

    try {

        localStorage.setItem(
            "rrpSession",
            sessionToken
        );

    }

    catch(error) {

        console.log(
            "Unable to save session."
        );

    }

}


/*
============================================================
SCANNER VARIABLES
============================================================
*/

let scanner = null;

let scanLocked = false;


/*
============================================================
SHOW SCAN MODE
============================================================
*/

function showScanMessage() {

    const message =

        document.getElementById(
            "message"
        );


    /*
    --------------------------------------------------------
    TRAY
    --------------------------------------------------------
    */

    if (
        scanType === "tray"
    ) {

        message.innerHTML =

            "📦 Point the camera at the TRAY QR";

    }


    /*
    --------------------------------------------------------
    PRODUCTION
    --------------------------------------------------------
    */

    else if (
        scanType === "production"
    ) {

        message.innerHTML =

            "🏭 Point the camera at the SUPPLY QR";

    }


    /*
    --------------------------------------------------------
    BATCH
    --------------------------------------------------------
    */

    else if (
        scanType === "batch"
    ) {

        message.innerHTML =

            "🏷️ Point the camera at the SUPPLY QR";

    }


    /*
    --------------------------------------------------------
    PART BASIC INFO
    --------------------------------------------------------
    */

    else if (
        scanType === "partbasic"
    ) {

        message.innerHTML =

            "📋 Point the camera at the INTERNAL PART QR";

    }


    /*
    --------------------------------------------------------
    BLANK CUTTING INFO
    --------------------------------------------------------
    */

    else if (
        scanType === "blankcutting"
    ) {

        message.innerHTML =

            "✂️ Point the camera at the INTERNAL PART QR";

    }


    /*
    --------------------------------------------------------
    NORMAL PART
    --------------------------------------------------------
    */

    else {

        message.innerHTML =

            "📷 Point the camera at the PART QR";

    }

}


/*
============================================================
START REAR / BACK CAMERA
============================================================
*/

function startRearCamera() {

    scanner =

        new Html5Qrcode(
            "reader"
        );


    /*
    ========================================================
    FIRST TRY:
    EXACT ENVIRONMENT CAMERA
    ========================================================
    */

    scanner.start(

        {
            facingMode: {
                exact: "environment"
            }
        },

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )

    .then(

        function() {

            showScanMessage();

        }

    )

    .catch(

        function(error) {

            console.log(
                "Exact rear camera failed:",
                error
            );


            /*
            ==================================================
            SECOND TRY:
            ENVIRONMENT CAMERA
            ==================================================
            */

            scanner.start(

                {
                    facingMode: "environment"
                },

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                onScanSuccess

            )

            .then(

                function() {

                    showScanMessage();

                }

            )

            .catch(

                function(error2) {

                    console.log(
                        "Environment camera failed:",
                        error2
                    );


                    /*
                    ==========================================
                    FINAL FALLBACK
                    ==========================================
                    */

                    startRearCameraFromList();

                }

            );

        }

    );

}


/*
============================================================
FALLBACK:
FIND REAR CAMERA FROM CAMERA LIST
============================================================
*/

function startRearCameraFromList() {


    /*
    ========================================================
    STOP EXISTING SCANNER
    ========================================================
    */

    try {

        if (scanner) {

            scanner.stop().catch(
                function() {}
            );

        }

    }

    catch(error) {}


    /*
    ========================================================
    CREATE FRESH SCANNER
    ========================================================
    */

    scanner =

        new Html5Qrcode(
            "reader"
        );


    /*
    ========================================================
    GET CAMERAS
    ========================================================
    */

    Html5Qrcode.getCameras()

        .then(

            function(cameras) {


                if (
                    !cameras ||
                    cameras.length === 0
                ) {

                    showError(
                        "❌ No camera found."
                    );

                    return;

                }


                /*
                ==============================================
                FIND REAR CAMERA
                ==============================================
                */

                let rearCamera = null;


                for (
                    let i = 0;
                    i < cameras.length;
                    i++
                ) {

                    const label =

                        String(
                            cameras[i].label || ""
                        )
                        .toLowerCase();


                    if (

                        label.indexOf(
                            "back"
                        ) !== -1 ||

                        label.indexOf(
                            "rear"
                        ) !== -1 ||

                        label.indexOf(
                            "environment"
                        ) !== -1

                    ) {

                        rearCamera =
                            cameras[i];

                        break;

                    }

                }


                /*
                ==============================================
                FINAL FALLBACK
                ==============================================
                */

                if (!rearCamera) {

                    rearCamera =
                        cameras[0];

                }


                /*
                ==============================================
                START CAMERA
                ==============================================
                */

                scanner.start(

                    rearCamera.id,

                    {
                        fps: 10,

                        qrbox: {
                            width: 250,
                            height: 250
                        }
                    },

                    onScanSuccess

                )

                .then(

                    function() {

                        showScanMessage();

                    }

                )

                .catch(

                    function(error) {

                        showError(

                            "❌ Camera error:<br>" +

                            escapeHtml(
                                error
                            )

                        );

                    }

                );

            }

        )

        .catch(

            function(error) {

                showError(

                    "❌ Unable to access camera:<br>" +

                    escapeHtml(
                        error
                    )

                );

            }

        );

}


/*
============================================================
INITIALIZE REAR CAMERA
============================================================
*/

showScanMessage();

startRearCamera();


/*
============================================================
QR SCAN SUCCESS
============================================================
*/

function onScanSuccess(
    decodedText
) {


    /*
    ========================================================
    PREVENT MULTIPLE SCANS
    ========================================================
    */

    if (
        scanLocked
    ) {

        return;

    }


    scanLocked = true;


    const scannedValue =

        decodedText.trim();


    /*
    ========================================================
    TRY TO INTERPRET QR AS URL
    ========================================================
    */

    let scannedURL = null;


    try {

        scannedURL =

            new URL(
                scannedValue
            );

    }

    catch(error) {

        scannedURL = null;

    }


    /*
    ========================================================
    PRODUCTION QR
    ========================================================
    */

    if (
        scanType === "production"
    ) {


        if (
            !scannedURL
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR generated by RRP."

            );

            scanLocked = false;

            return;

        }


        const qrPage =

            scannedURL.searchParams.get(
                "page"
            );


        const supplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (

            qrPage !== "production" ||

            !supplyID

        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the correct Supply QR."

            );

            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                supplyID
            ) +

            "</b><br><br>" +

            "Opening Production Page..."

        );


        stopScanner();


        const productionURL =

            appURL +

            "?page=production" +

            "&id=" +

            encodeURIComponent(
                supplyID
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    productionURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    PART BASIC INFO QR
    ========================================================

    QR VALUE IS DIRECTLY THE
    INTERNAL PART NUMBER.

    Example:

    RRP-PART-001

    Opens:

    ?page=partbasicinfo
    &internalPart=RRP-PART-001

    ========================================================
    */

    if (
        scanType === "partbasic"
    ) {


        if (
            !scannedValue
        ) {

            showError(

                "❌ Empty Part QR.<br><br>" +

                "Please scan a valid Internal Part QR."

            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ PART QR SCANNED<br><br>" +

            "Internal Part Number: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Opening Part Basic Info..."

        );


        stopScanner();


        const partBasicURL =

            appURL +

            "?page=partbasicinfo" +

            "&internalPart=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =

                    partBasicURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BLANK CUTTING INFO QR
    ========================================================

    QR VALUE IS DIRECTLY THE
    INTERNAL PART NUMBER.

    Example:

    RRP-PART-001

    Opens:

    ?page=blankcuttinginfo
    &internalPart=RRP-PART-001

    ========================================================
    */

    if (
        scanType === "blankcutting"
    ) {


        /*
        ----------------------------------------------------
        VALIDATE
        ----------------------------------------------------
        */

        if (
            !scannedValue
        ) {

            showError(

                "❌ Empty Part QR.<br><br>" +

                "Please scan a valid Internal Part QR."

            );


            scanLocked = false;

            return;

        }


        /*
        ----------------------------------------------------
        SHOW SUCCESS
        ----------------------------------------------------
        */

        showSuccess(

            "✅ PART QR SCANNED<br><br>" +

            "Internal Part Number: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Opening Blank Cutting Info..."

        );


        /*
        ----------------------------------------------------
        STOP CAMERA
        ----------------------------------------------------
        */

        stopScanner();


        /*
        ----------------------------------------------------
        CREATE BLANK CUTTING URL
        ----------------------------------------------------
        */

        const blankCuttingURL =

            appURL +

            "?page=blankcuttinginfo" +

            "&internalPart=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        /*
        ----------------------------------------------------
        OPEN BLANK CUTTING PAGE
        ----------------------------------------------------
        */

        setTimeout(

            function() {

                window.location.href =

                    blankCuttingURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    EXISTING PART QR
    ========================================================
    */

    if (
        scanType === "part"
    ) {


        showSuccess(

            "✅ Part QR scanned<br><br>" +

            "Part: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Loading Supply Page..."

        );


        stopScanner();


        const partURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    partURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    TRAY QR
    ========================================================
    */

    if (
        scanType === "tray"
    ) {


        if (
            !existingPart
        ) {

            showError(
                "❌ Part number is missing."
            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ Tray QR scanned<br><br>" +

            "Tray: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Returning to Supply Page..."

        );


        stopScanner();


        const trayURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                existingPart
            ) +

            "&tray=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +

            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +

            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +

            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +

            encodeURIComponent(
                remarks
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    trayURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BATCH / SUPPLY QR
    ========================================================
    */

    if (
        scanType === "batch"
    ) {


        if (
            !scannedURL
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR."

            );


            scanLocked = false;

            return;

        }


        const batchQRPage =

            scannedURL.searchParams.get(
                "page"
            );


        const batchSupplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (

            batchQRPage !== "production" ||

            !batchSupplyID

        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "The QR must contain a valid Supply ID."

            );


            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                batchSupplyID
            ) +

            "</b><br><br>" +

            "Opening Batch Create Page..."

        );


        stopScanner();


        const batchURL =

            appURL +

            "?page=batchcreate" +

            "&scan=" +

            encodeURIComponent(
                batchSupplyID
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =
                    batchURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    UNKNOWN SCAN MODE
    ========================================================
    */

    showError(

        "❌ Unknown scan mode: <b>" +

        escapeHtml(
            scanType
        ) +

        "</b><br><br>" +

        "Please return to RRP Part Information and try again."

    );


    scanLocked = false;

}


/*
============================================================
STOP SCANNER
============================================================
*/

function stopScanner() {

    if (
        scanner
    ) {

        scanner.stop()

            .catch(
                function() {}
            );

    }

}


/*
============================================================
SHOW ERROR
============================================================
*/

function showError(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "error";

}


/*
============================================================
SHOW SUCCESS
============================================================
*/

function showSuccess(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "success";

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHtml(
    value
) {

    return String(

        value == null

            ? ""

            : value

    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
