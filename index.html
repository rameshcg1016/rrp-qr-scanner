<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
}

</style>

</head>


<body>

<div class="container">

<h2>RRP QR SCANNER</h2>

<div id="reader"></div>

<div id="message">
Starting camera...
</div>

</div>


<script>

/*
====================================================
CREATE SCANNER
====================================================
*/

const scanner = new Html5Qrcode("reader");


/*
====================================================
READ URL PARAMETERS
====================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );


/*
====================================================
GET EXISTING PART
====================================================
*/

const existingPart =
    params.get("part") || "";


/*
====================================================
DETERMINE SCAN MODE
====================================================

NO PART PARAMETER
    = PART SCAN

PART PARAMETER EXISTS
    = TRAY SCAN

====================================================
*/

const scanType =
    existingPart !== ""
        ? "tray"
        : "part";


/*
====================================================
SHOW SCANNER MODE
====================================================
*/

if (scanType === "tray") {

    document.getElementById("message").innerHTML =
        "📦 Point camera at TRAY QR";

} else {

    document.getElementById("message").innerHTML =
        "📷 Point camera at PART QR";

}


/*
====================================================
QR SCAN SUCCESS
====================================================
*/

function onScanSuccess(decodedText) {

    const scannedValue = decodedText.trim();

    const currentURL =
        new URL(window.location.href);

    const currentType =
        currentURL.searchParams.get("type");

    const currentPart =
        currentURL.searchParams.get("part");

    document.getElementById("message").innerHTML =
        "QR SCANNED<br><br>" +
        "QR VALUE: <b>" + scannedValue + "</b><br><br>" +
        "TYPE: <b>" + currentType + "</b><br>" +
        "PART: <b>" + currentPart + "</b>";

    /*
    DO NOT REDIRECT YET
    */

    if (currentType === "tray") {

        const trayURL =
            "https://script.google.com/macros/s/" +
            "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
            "/exec?page=supply" +
            "&part=" +
            encodeURIComponent(currentPart) +
            "&tray=" +
            encodeURIComponent(scannedValue);

        document.getElementById("message").innerHTML +=
            "<br><br>" +
            "TRAY MODE DETECTED<br><br>" +
            "RETURN URL:<br>" +
            trayURL;

        return;
    }

    /*
    PART MODE
    */

    const partURL =
        "https://script.google.com/macros/s/" +
        "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
        "/exec?page=supply" +
        "&part=" +
        encodeURIComponent(scannedValue);

    document.getElementById("message").innerHTML +=
        "<br><br>" +
        "PART MODE DETECTED<br><br>" +
        "RETURN URL:<br>" +
        partURL;
}

/*
====================================================
REDIRECT AFTER SCAN
====================================================
*/

function redirectAfterScan(scannedValue) {


    /*
    ================================================
    APPS SCRIPT URL
    ================================================
    */

    const appURL =
        "https://script.google.com/macros/s/" +
        "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
        "/exec";


    /*
    ================================================
    PART SCAN
    ================================================
    */

    if (scanType === "part") {

        const partURL =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(
                scannedValue
            );


        window.location.href =
            partURL;


        return;
    }


    /*
    ================================================
    TRAY SCAN
    ================================================
    */

    if (scanType === "tray") {


        /*
        Existing Part must be available
        */

        if (!existingPart) {

            document.getElementById("message").innerHTML =
                "❌ Part number is missing.";

            return;

        }


        /*
        Build Tray URL
        */

        const trayURL =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(
                existingPart
            ) +
            "&tray=" +
            encodeURIComponent(
                scannedValue
            );


        /*
        Show confirmation
        */

        document.getElementById("message").innerHTML =
            "✅ Tray scanned: " +
            scannedValue +
            "<br><br>" +
            "Returning to Supply Page...";


        /*
        Redirect
        */

        setTimeout(function() {

            window.location.href =
                trayURL;

        }, 500);


        return;
    }


    /*
    ================================================
    UNKNOWN
    ================================================
    */

    document.getElementById("message").innerHTML =
        "❌ Unknown scan mode.";

}


/*
====================================================
START CAMERA
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {


    if (
        !cameras ||
        cameras.length === 0
    ) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    Use first camera
    */

    const cameraId =
        cameras[0].id;


    /*
    Start scanner
    */

    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )

    .then(function() {


        if (scanType === "tray") {

            document.getElementById("message").innerHTML =
                "📦 Point camera at TRAY QR";

        } else {

            document.getElementById("message").innerHTML =
                "📷 Point camera at PART QR";

        }

    })

    .catch(function(error) {

        document.getElementById("message").innerHTML =
            "❌ Camera error: " +
            error;

    });

})


.catch(function(error) {

    document.getElementById("message").innerHTML =
        "❌ Unable to access camera: " +
        error;

});

</script>

</body>

</html>
