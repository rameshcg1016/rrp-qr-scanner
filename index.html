<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    word-break: break-word;
    line-height: 1.5;
}

</style>

</head>


<body>

<div class="container">

    <h2>RRP QR SCANNER</h2>

    <div id="reader"></div>

    <div id="message">
        Starting camera...
    </div>

</div>


<script>


/*
====================================================
READ CURRENT URL
====================================================
*/

const currentURL =
    new URL(window.location.href);

const params =
    currentURL.searchParams;


/*
====================================================
GET PARAMETERS
====================================================
*/

const existingPart =
    params.get("part") || "";

const supplyDate =
    params.get("supplyDate") || "";

const suppliedKg =
    params.get("suppliedKg") || "";

const targetQty =
    params.get("targetQty") || "";

const remarks =
    params.get("remarks") || "";


/*
====================================================
DETERMINE SCAN TYPE
====================================================

No PART parameter
        =
PART SCAN

PART parameter exists
        =
TRAY SCAN

====================================================
*/

const scanType =
    existingPart.trim() !== ""
        ? "tray"
        : "part";


/*
====================================================
APPS SCRIPT URL
====================================================
*/

const appURL =
    "https://script.google.com/macros/s/" +
    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +
    "/exec";


/*
====================================================
SHOW SCAN MODE
====================================================
*/

if (scanType === "tray") {

    document.getElementById("message").innerHTML =
        "📦 Point the camera at the TRAY QR";

} else {

    document.getElementById("message").innerHTML =
        "📷 Point the camera at the PART QR";

}


/*
====================================================
CREATE SCANNER
====================================================
*/

const scanner =
    new Html5Qrcode("reader");


/*
====================================================
PREVENT MULTIPLE SCANS
====================================================
*/

let scanLocked = false;


/*
====================================================
QR SCAN SUCCESS
====================================================
*/

function onScanSuccess(decodedText) {

    if (scanLocked) {
        return;
    }

    scanLocked = true;


    const scannedValue =
        decodedText.trim();


    /*
    ==================================================
    PART QR
    ==================================================
    */

    if (scanType === "part") {

        document.getElementById("message").innerHTML =
            "✅ Part QR scanned<br><br>" +
            "Part: <b>" +
            scannedValue +
            "</b><br><br>" +
            "Loading...";


        scanner.stop().catch(
            function() {}
        );


        /*
        ----------------------------------------------
        BUILD PART URL
        ----------------------------------------------
        */

        const partURL =
            appURL +
            "?page=supply" +
            "&part=" +
            encodeURIComponent(
                scannedValue
            );


        setTimeout(
            function() {

                window.location.href =
                    partURL;

            },
            500
        );


        return;
    }


    /*
    ==================================================
    TRAY QR
    ==================================================
    */

    if (scanType === "tray") {


        /*
        ----------------------------------------------
        MAKE SURE PART EXISTS
        ----------------------------------------------
        */

        if (!existingPart) {

            document.getElementById("message").innerHTML =
                "❌ Part number is missing.";

            scanLocked = false;

            return;

        }


        /*
        ----------------------------------------------
        SHOW SCANNED TRAY
        ----------------------------------------------
        */

        document.getElementById("message").innerHTML =
            "✅ Tray QR scanned<br><br>" +
            "Tray: <b>" +
            scannedValue +
            "</b><br><br>" +
            "Returning to Supply Page...";


        scanner.stop().catch(
            function() {}
        );


        /*
        ==================================================
        BUILD FINAL SUPPLY URL
        ==================================================
        
        IMPORTANT:
        We now preserve ALL supply information.
        ==================================================
        */

        const trayURL =
            appURL +
            "?page=supply" +

            "&part=" +
            encodeURIComponent(
                existingPart
            ) +

            "&tray=" +
            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +
            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +
            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +
            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +
            encodeURIComponent(
                remarks
            );


        /*
        ----------------------------------------------
        DEBUG DISPLAY
        ----------------------------------------------
        */

        console.log(
            "TRAY URL:",
            trayURL
        );


        /*
        ----------------------------------------------
        REDIRECT
        ----------------------------------------------
        */

        setTimeout(
            function() {

                window.location.href =
                    trayURL;

            },
            500
        );


        return;
    }


    /*
    ==================================================
    UNKNOWN
    ==================================================
    */

    document.getElementById("message").innerHTML =
        "❌ Unknown scan mode.";

}


/*
====================================================
GET AVAILABLE CAMERAS
====================================================
*/

Html5Qrcode.getCameras()

.then(function(cameras) {


    if (
        !cameras ||
        cameras.length === 0
    ) {

        document.getElementById("message").innerHTML =
            "❌ No camera found.";

        return;

    }


    /*
    ----------------------------------------------
    USE FIRST CAMERA
    ----------------------------------------------
    */

    const cameraId =
        cameras[0].id;


    /*
    ----------------------------------------------
    START CAMERA
    ----------------------------------------------
    */

    scanner.start(

        cameraId,

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        onScanSuccess

    )


    .then(function() {


        if (
            scanType === "tray"
        ) {

            document.getElementById(
                "message"
            ).innerHTML =
                "📦 Point the camera at the TRAY QR";

        } else {

            document.getElementById(
                "message"
            ).innerHTML =
                "📷 Point the camera at the PART QR";

        }

    })


    .catch(function(error) {

        document.getElementById(
            "message"
        ).innerHTML =
            "❌ Camera error:<br>" +
            error;

    });

})


.catch(function(error) {

    document.getElementById(
        "message"
    ).innerHTML =
        "❌ Unable to access camera:<br>" +
        error;

});

</script>


</body>

</html>
