<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RRP QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    margin: 0;

    padding: 20px;

    background: #f2f2f2;

}


.container {

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 12px;

}


h2 {

    text-align: center;

    margin-top: 5px;

}


#reader {

    width: 100%;

    margin-top: 20px;

}


#message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

    word-break: break-word;

    line-height: 1.5;

}


.error {

    color: #c62828;

}


.success {

    color: #2e7d32;

}


.info {

    color: #555;

}

</style>

</head>


<body>


<div class="container">


    <h2>

        RRP QR SCANNER

    </h2>


    <div id="reader"></div>


    <div id="message"
         class="info">

        Starting camera...

    </div>


</div>


<script>


/*
============================================================
RRP APPS SCRIPT URL
============================================================
*/

const appURL =

    "https://script.google.com/macros/s/" +

    "AKfycby4Yd5jYEhDl8_FcQ4dUt3EAe_LIGQwfcVcJBQBqb473fOizp3MicxNNXNckuOgKWatFA" +

    "/exec";


/*
============================================================
GITHUB SCANNER URL
============================================================
*/

const scannerURL =

    "https://rameshcg1016.github.io/rrp-qr-scanner/";


/*
============================================================
READ CURRENT URL
============================================================
*/

const currentURL =

    new URL(
        window.location.href
    );


const params =

    currentURL.searchParams;


/*
============================================================
SCAN TYPE
============================================================

part
tray
production
batch

============================================================
*/

const scanType =

    params.get("type") || "part";


/*
============================================================
EXISTING PART
============================================================
*/

const existingPart =

    params.get("part") || "";


/*
============================================================
SUPPLY DATA
============================================================
*/

const supplyDate =

    params.get("supplyDate") || "";


const suppliedKg =

    params.get("suppliedKg") || "";


const targetQty =

    params.get("targetQty") || "";


const remarks =

    params.get("remarks") || "";


/*
============================================================
SESSION TOKEN
============================================================

The Apps Script login creates this token.

We keep it while moving through the scanner.

============================================================
*/

let sessionToken =

    params.get("session") || "";


/*
------------------------------------------------------------
IF SESSION NOT IN URL
TRY LOCAL STORAGE
------------------------------------------------------------
*/

if (!sessionToken) {

    sessionToken =

        localStorage.getItem(
            "rrpSession"
        ) || "";

}


/*
------------------------------------------------------------
SAVE SESSION
------------------------------------------------------------
*/

if (sessionToken) {

    localStorage.setItem(

        "rrpSession",

        sessionToken

    );

}


/*
============================================================
SCANNER
============================================================
*/

let scanner = null;

let scanLocked = false;


/*
============================================================
SHOW SCAN MODE
============================================================
*/

function showScanMessage() {


    const message =

        document.getElementById(
            "message"
        );


    if (
        scanType === "tray"
    ) {

        message.innerHTML =

            "📦 Point the camera at the TRAY QR";

    }

    else if (
        scanType === "production"
    ) {

        message.innerHTML =

            "🏭 Point the camera at the SUPPLY QR";

    }

    else if (
        scanType === "batch"
    ) {

        message.innerHTML =

            "🏷️ Point the camera at the SUPPLY QR";

    }

    else {

        message.innerHTML =

            "📷 Point the camera at the PART QR";

    }

}


/*
============================================================
INITIAL MESSAGE
============================================================
*/

showScanMessage();


/*
============================================================
START SCANNER
============================================================
*/

scanner =

    new Html5Qrcode(
        "reader"
    );


Html5Qrcode.getCameras()

.then(

    function(cameras) {


        if (
            !cameras ||
            cameras.length === 0
        ) {

            document.getElementById(
                "message"
            ).innerHTML =

                "❌ No camera found.";

            return;

        }


        /*
        ----------------------------------------------------
        USE FIRST CAMERA
        ----------------------------------------------------
        */

        const cameraId =

            cameras[0].id;


        /*
        ----------------------------------------------------
        START CAMERA
        ----------------------------------------------------
        */

        scanner.start(

            cameraId,

            {

                fps: 10,

                qrbox: {

                    width: 250,

                    height: 250

                }

            },

            onScanSuccess

        )

        .then(

            function() {

                showScanMessage();

            }

        )

        .catch(

            function(error) {

                document.getElementById(
                    "message"
                ).innerHTML =

                    "❌ Camera error:<br>" +

                    escapeHtml(
                        error
                    );

            }

        );

    }

)

.catch(

    function(error) {

        document.getElementById(
            "message"
        ).innerHTML =

            "❌ Unable to access camera:<br>" +

            escapeHtml(
                error
            );

    }

);


/*
============================================================
QR SCAN SUCCESS
============================================================
*/

function onScanSuccess(
    decodedText
) {


    /*
    --------------------------------------------------------
    PREVENT MULTIPLE SCANS
    --------------------------------------------------------
    */

    if (
        scanLocked
    ) {

        return;

    }


    scanLocked = true;


    const scannedValue =

        decodedText.trim();


    /*
    ========================================================
    TRY TO INTERPRET QR AS URL
    ========================================================
    */

    let scannedURL = null;


    try {

        scannedURL =

            new URL(
                scannedValue
            );

    }

    catch(error) {

        scannedURL = null;

    }


    /*
    ========================================================
    PRODUCTION QR
    ========================================================
    */

    if (
        scanType === "production"
    ) {


        if (
            !scannedURL
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR generated by RRP."

            );

            scanLocked = false;

            return;

        }


        const qrPage =

            scannedURL.searchParams.get(
                "page"
            );


        const supplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (
            qrPage !== "production" ||
            !supplyID
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the correct Supply QR."

            );

            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                supplyID
            ) +

            "</b><br><br>" +

            "Opening Production Page..."

        );


        stopScanner();


        const productionURL =

            appURL +

            "?page=production" +

            "&id=" +

            encodeURIComponent(
                supplyID
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =

                    productionURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    PART QR
    ========================================================
    */

    if (
        scanType === "part"
    ) {


        showSuccess(

            "✅ Part QR scanned<br><br>" +

            "Part: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Loading Supply Page..."

        );


        stopScanner();


        const partURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =

                    partURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    TRAY QR
    ========================================================
    */

    if (
        scanType === "tray"
    ) {


        if (
            !existingPart
        ) {

            showError(
                "❌ Part number is missing."
            );

            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ Tray QR scanned<br><br>" +

            "Tray: <b>" +

            escapeHtml(
                scannedValue
            ) +

            "</b><br><br>" +

            "Returning to Supply Page..."

        );


        stopScanner();


        const trayURL =

            appURL +

            "?page=supply" +

            "&part=" +

            encodeURIComponent(
                existingPart
            ) +

            "&tray=" +

            encodeURIComponent(
                scannedValue
            ) +

            "&supplyDate=" +

            encodeURIComponent(
                supplyDate
            ) +

            "&suppliedKg=" +

            encodeURIComponent(
                suppliedKg
            ) +

            "&targetQty=" +

            encodeURIComponent(
                targetQty
            ) +

            "&remarks=" +

            encodeURIComponent(
                remarks
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =

                    trayURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    BATCH / SUPPLY QR
    ========================================================
    */

    if (
        scanType === "batch"
    ) {


        if (
            !scannedURL
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "Please scan the Supply QR."

            );

            scanLocked = false;

            return;

        }


        const batchQRPage =

            scannedURL.searchParams.get(
                "page"
            );


        const batchSupplyID =

            scannedURL.searchParams.get(
                "id"
            );


        if (
            batchQRPage !== "production" ||
            !batchSupplyID
        ) {

            showError(

                "❌ Invalid Supply QR.<br><br>" +

                "The QR must contain a valid Supply ID."

            );

            scanLocked = false;

            return;

        }


        showSuccess(

            "✅ SUPPLY QR SCANNED<br><br>" +

            "Supply ID: <b>" +

            escapeHtml(
                batchSupplyID
            ) +

            "</b><br><br>" +

            "Opening Batch Create Page..."

        );


        stopScanner();


        const batchURL =

            appURL +

            "?page=batchcreate" +

            "&scan=" +

            encodeURIComponent(
                batchSupplyID
            ) +

            "&session=" +

            encodeURIComponent(
                sessionToken
            );


        setTimeout(

            function() {

                window.location.href =

                    batchURL;

            },

            500

        );


        return;

    }


    /*
    ========================================================
    UNKNOWN SCAN MODE
    ========================================================
    */

    showError(
        "❌ Unknown scan mode."
    );


    scanLocked = false;

}


/*
============================================================
STOP SCANNER
============================================================
*/

function stopScanner() {


    if (
        scanner
    ) {

        scanner.stop()

        .catch(
            function() {}
        );

    }

}


/*
============================================================
SHOW ERROR
============================================================
*/

function showError(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "error";

}


/*
============================================================
SHOW SUCCESS
============================================================
*/

function showSuccess(
    message
) {

    const element =

        document.getElementById(
            "message"
        );


    element.innerHTML =
        message;


    element.className =
        "success";

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHtml(
    value
) {

    return String(

        value == null
            ? ""
            : value

    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>

</html>
